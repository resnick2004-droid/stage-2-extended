    firm: mffu
    value: "trades may be placed from 6:00 PM (the Globex open) until the New York session close at 4:10 PM, times printed as EST; open positions are closed automatically at 4:10 PM on regular (non-holiday) trading days; on holidays there is no auto-liquidation at the early close and the trader must close positions before the market closes or the account is breached; no last-entry time separate from the 4:10 PM close is stated; NQ and MNQ trade Sunday - Friday 17:00 - 16:00 CT with a daily break 16:00 - 17:00 CT (9735811); every plan (the page names none)"
    units: text
    status: verified
    article_id: "9558251; 9735811"
    url: https://help.myfundedfutures.com/en/articles/9558251-permitted-times-to-trade
    date_read: 2026-11-20
    verified_by: rules-verifier (stage2-extended; MFFU work list of LEVER_TABLE_mffu.md s.6, main tree working copy)
    quote: |
      H9558251 "Permitted Times to Trade" (August 24, 2026): "beginning at 6:00 PM EST when the Globex session opens" / "until the New York session closes at 4:10 PM EST" / "automatically closed at 4:10 PM EST on regular (non-holiday) trading days"
      Holidays: "auto-liquidation will not occur at the half-time market close" / "the trader is responsible for closing the positions"
      H9735811 (August 24, 2026), NQ and MNQ rows: "Sunday - Friday 17:00 - 16:00 CT" / "Daily Break: 16:00 - 17:00 CT"
    stage2_key: null
    stage2_value: null
    note: >
      H9558251 twice: the open, the close and the 4:10 PM auto-close in both (verbatim in one, near-verbatim in the
      other); the holiday lines verbatim in one and the same in substance in the other. It sits in the "Welcome
      Aboard" collection's "Core Rules" group with H9735811, and names no plan, so it is read as firm-wide; H16158363
      and the other plan pages state no hours. Also on it: placing a trade repeatedly "after 4:10 PM EST" can execute
      and may disqualify the account; illiquid hours may be traded at the trader's discretion. TIME ZONE: the page
      prints "EST" throughout. It ties 6:00 PM to the Globex open, which H9735811 gives as 17:00 CT; only New York
      local time (ET) makes both hold all year (on literal EST in daylight-saving months the open would be an hour
      after the Globex open, and the 4:10 PM close would fall after the 16:00 CT halt). So 4:10 PM is read as 16:10 ET
      = 15:10 CT. That is this verifier's reading, not a sentence: the lead may downgrade it. The flat-by time sets
      MFFU's sessions (T2, T3) and each session's last bar. H9735811's trading-hours cell is the exchange's session,
      not MFFU's flat-by rule.

