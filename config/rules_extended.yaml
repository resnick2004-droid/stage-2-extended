    quote: |
      No official page read names GDP ("GDP", "Gross Domestic Product", BEA) as a Tier 1 News Event, or restricts trading or order entry at a GDP release.
      13613539 gives the Tier 1 list as examples: "Ahead of Tier 1 News Events (for example, CPI, FOMC, NFP, PPI), Topstep temporarily restricts new opening positions on equity index products and metals in SIM to protect Traders from extreme volatility." Its schedule table (columns Event | Announcement (CT) | Window (CT)) has five rows, and none is GDP: CPI, FOMC rate decision, FOMC press conference, NFP/Unemployment Rate, PPI.
      How a window is announced: "How you'll be alerted: we'll email you and you'll see a banner at the top of the platform, so you're always prepared."
      8284211's release table (seven rows) has no GDP row, and the page says: "Times are subject to change — Traders are responsible for knowing what releases are scheduled and when."
    stage2_key: null
    stage2_value: null
    note: >
      UNSTATED, a successful reading. NEW TO THIS RECORD. The pages do not name GDP, and do not say that the five-row
      table is the whole list. The "for example" wording and the email-and-banner alert leave open whether Topstep
      can declare a window on a day not in the table. No page read says it does so for GDP, and none says it never
      does. A web search of help.topstep.com for GDP, "Gross Domestic Product" or ISM found no official article
      beyond 8284211. Its other hits were third-party pages and topstep.com market commentary, which were not read
      and are not rules. THE DESIGNS (a reading for the lead): GDP is released at 08:30 ET, which is 07:30 CT, the
      announcement time of the three 7:30 AM rows. P-16 offers a mark every five minutes from 17:00 CT (Stage 2
      D-525). Its report-day cut removes marks before 07:35 CT only on BLS 08:30 days. So on a BEA GDP day the
      07:30 mark is offered, and its market entry falls at the release bar (E-021 (3); the mechanisms note, section
      2 item 5). The published pages place no restriction on that entry. IF Topstep ever treated a GDP release like
      the 7:30 AM rows, the window would be 7:25 to 7:35 AM. In SIM it would block a new NQ opening, cap a micro
      opening at 3 on a 50K Combine and, on a 50K XFA, at 1 below a $2,000 balance and 3 above. Pending orders would
      not fill. A position opened before 7:25 could be held (tier1_news_events_restriction). The engine models none
      of this, as for every news window. For the conduct reading of a full-size entry at the release, see
      max_size_into_major_news_scope.

