[project]
name = "stage2-extended"
version = "0.1.0"
description = "Execution models for a prop-firm user's journey, on Stage 2's vendored engine (read-only)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: runs Stage 2's engine (about a minute)",
    "heavy: reads the real bars or atlas (any amount; Q-134, tests/test_heavy_marker_guard.py) or runs a campaign; one at a time under run.lock",
]
# Two tiers. The fast tier -- `-m "not slow and not heavy"` -- is what scripts/pre-commit runs (the .py-edit hook,
# scripts/hooks/run_tests.py, applies it to the edited file's tests and the two foundation checks only, Q-147);
# the whole suite runs in /validate and before any reading is believed.
