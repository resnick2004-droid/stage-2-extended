      The search IM1 was chosen from on 2026-09-26 (docs/candidates/cards/IM1.md: the operator's decisions of that day),
      which IM2 inherits: IM2 is IM1's entry signal re-sized to stage one's lifecycle (D-161), and no other model was
      on the table when it was formed. The alternatives: docs/candidates/SHORTLIST.md's three candidates, the bracket
      map's NQ 08:35 lead "beside the shortlist" (NEXT_STEPS 5g), and the leads D-154 had re-screened (shortlist,
      bracket map, FV1); the searches behind them: the effect atlas and its F, R and O families, the shortlist's first
      look, FV1, the opening-gap and open-reversion models.
