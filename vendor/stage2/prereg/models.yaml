# The P1 trial ledger (D-197): every model, registration, withdrawal, protocol option, screen and atlas family stage
# two ran or declared, with the data it touched and its trials. D-189 counts its N from here
# (`propedge/research/ledger.py`, `count_n`); `tests/test_ledger.py` checks the file and recounts P-04's N by hand.
#
# Each row: `windows` the dates its data spanned (warm-ups included), `resolution` the bars it read (`minute` for every
# QuantConnect kit here, whatever per-day or per-entry records it exported; `none` for no market data), `markets` the
# markets it read with the tests on each, `count_tests` whether those tests were selection steps (then each counts on
# the registration's markets; otherwise the row counts once), `pools` the selection pools it sat in, and `reason` why
# -- the judgements are written here so N can be recounted from this file alone. Built on 2026-09-30 from an inventory
# of DECISIONS.md, NEXT_STEPS.md, prereg/, the result manifests and results/variants.jsonl (D-208), before IM2's
# development score existed.
#
# Studies that read no market data (the contract calculators, setups per day, the feasibility frontier, L3 and L5,
# the stop band) hold no trial and are not listed; nor is the external QuantConnect-assistant material, which D-85
# bars as an input. Stage one's and stage 2B's own ledgers stay theirs (propsim; 2B's F- and C- ids).

pools:
  - id: pool-2026-09-26-im1
