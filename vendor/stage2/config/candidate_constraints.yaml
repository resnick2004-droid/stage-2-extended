    seed: 20260923
    paths: 4000
    max_days: 4000
    why_simulated: Pass probability and duration have closed forms, but the RTP trigger 'multiple accounts
      hit the Maximum Loss Limit in one day' is about the joint TIMING of first-passage events, which
      does not.
