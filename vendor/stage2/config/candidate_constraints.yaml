  route_1_time_partitioned_slots:
    adopted: false
    rule_text_permits_it: 13747047 prohibits SIMULTANEOUSLY going long and short the same or correlated
      instrument. Non-overlapping windows with confirmed-flat sequencing never hold opposing positions
      at any instant, so on the TEXT the partition unit may be (group, window).
    why_not_adopted: 'Three readings say otherwise or invite review: surveillance granularity is undocumented
      and may evaluate exposure per day rather than per instant; the page threatens to flag hedging BEHAVIOUR,
      not merely positions, and systematic same-group alternation across accounts is what a behavioural
      review looks at; and ''even if the overlap is brief or unintentional'' states which way they resolve
      ambiguity. Against closure, payout ineligibility and no reinstatement, the D-58 asymmetry argument
      forbids relying on it. SPECIFIED AND UNUSED pending written confirmation from support (D-61).'
    specification_if_confirmed:
      partition_unit: (correlated group, time window)
      minimum_gap_minutes: 5
      gap_measured_from: last fill CONFIRMED in the group to next order submission in it; confirmed-flat
        is the binding requirement and the gap absorbs clock skew, late and partial fills
      pre_trade_gate: a campaign-level scheduler holds ONE window token per group. An order without the
        token is REJECTED, NOT QUEUED. The token is released only when every account is confirmed flat
        in that group, and cannot be reacquired within the gap.
      windows_per_group: 11
      window_minutes: 30
      session_minutes: 390
    correlation_assumption_makes_it_self_limiting: Two windows on ONE group share instrument, day and
      volatility regime, so rho_w exceeds the cross-group rho -- plausibly 0.4-0.6 against 0.0-0.3, an
      ASSUMPTION until measured. C's advantage over B closes as rho rises, so the mechanism that makes
      five-account C layouts staffable is the one that erodes what they were staffed for. READ SUCH A
      LAYOUT OFF THE HIGH-RHO ROW.
  route_2_more_groups:
    adopted: true
    groups_5_to_8: *id001
    reaches: N=4/m=2 and stops; N=5/m=2 needs 10 slots against 8 groups
    merged_not_new: silver and platinum join gold; RBOB and heating oil join crude; Russell, Dow and Nikkei
      join equity index; every G10 currency joins euro FX
    the_real_loss: Corn, wheat, soybeans, meal, oil, lean hogs and live cattle are permitted and would
      be the BEST diversifiers on the list -- weather and supply driven, weakly correlated with every
      financial group -- but NONE has a micro contract. Each costs a whole mini-equivalent, so none is
      expressible at the entry tier. They arrive only at higher scaling tiers.
    correlations_are_assumptions: 'Natural gas is strongest on mechanism (weather, storage and US production
      drive none of the other five). Crypto''s assumed independence is REGIME-DEPENDENT: it converges
      with equity index in risk-off stress, which is exactly when a correlated multi-account drawdown
      matters.'
  what_binds_next: 'Once either route lands there are far more slots than any layout needs, and MECHANISM
    SUPPLY binds instead: T4 requires every candidate to arrive with a stated mechanism, an outside prior
    and its cost in k. That is a research constraint and partitioning cannot solve it.'
  source: results/slot_supply.csv; DECISIONS.md D-60, D-61, D-62
