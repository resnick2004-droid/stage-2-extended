      value: <= 1/8 of the $2,000 cushion ($250)
      fixed_by: T7
      why: conduct guardrail applied to the day (D-50); sweep 1/12-1/4 in T7 (D-54)
    largest_planned_day:
      value: < $1,650
      fixed_by: pre_reg
      why: 55% consistency cap on a $3,000 target
    stop_width:
      value: cost floor <= stop <= daily limit / (contracts x tick)
      fixed_by: pre_reg floor, T7 ceiling
      why: drag falls as the stop widens (D-65)
    stop_multiplier_and_tick_floor:
      value: fixed, per instrument, never tuned
      fixed_by: pre_reg
      why: part of the criterion's definition for time-exit trades (D-46)
    R:
      value: '> 1; 1.5-3 tested'
      fixed_by: pre_reg
      why: winners larger than losers; edge amplification is largest at SMALL risk, which points the same
        way as the guardrails
    target_geometry:
      value: profit spread over >= 2 days; no day >= 55%
      fixed_by: pre_reg
      why: consistency cap
    trades_per_day:
      value: 1 per market per leg, legs sequential
      fixed_by: pre_reg
      why: CME settlement schedule (D-50); cap applies per leg
    expected_resolution:
      value: report it with the subscription count
      fixed_by: pre_reg
      why: fees are a step function in calendar time; this is why the objective is time-aware (D-02)
    excluded_deliberately: 'The R x risk ~ $1,500 ridge. It is the ZERO-EDGE optimum, marked ''not admissible''
      by propsim D-36, and a positive-edge design does not sit on it: with an edge, more bets is better,
      not fewer.'
  funded_phase:
    position_size:
      value: from the CURRENT tier, re-derived after every withdrawal
      fixed_by: pre_reg
      why: ladder 0:2,1500:3,2000:5 (D-32); a payout drops the tier (D-53)
    daily_risk_limit:
      value: <= 1/8 of the CURRENT cushion
      fixed_by: T7
      why: computed at the current tier, never the highest reached (D-53)
    per_leg_allocation:
      value: equal RISK across legs, spread <= 1.5x
      fixed_by: pre_reg
      why: a pooled test weights markets equally in risk
    payout_trigger:
      value: a buffer above the minimum; value NOT ported from stage one
      fixed_by: T7
      why: propsim D-45's $8,000 ignored payout latency, reinvestment and per-contract costs -- a hint,
        not a settled value
    payout_method:
      value: fee AND lag by method
      fixed_by: pre_reg input
      why: payout_methods_and_fees is UNVERIFIED -- a blocker, not a default
    high_R_payout_timing:
      value: report the expected delay
      fixed_by: pre_reg
      why: the net-profit-since-payout rule stops a high-R profile withdrawing while net-negative, so
        its cash arrives later even when larger
    expected_ratchet:
      value: reported beside EV
      fixed_by: pre_reg
      why: 'the leak identity: E[Q] = (1-P_pay)(2000 - E[ratchet]); the leak IS the ratchet'
    accounts:
      value: <= 5 active; layout 3x(m=2) + 2x(m=1)
      fixed_by: T7
      why: D-34 cap; layout from D-63 on expected funded accounts
    cross_account_direction:
      value: one signed direction per correlated group at every instant
      fixed_by: hard
      why: D-55; groups per D-58 and D-62
  source: docs/CONTRACT_FOUNDATIONS.md; vendor/propsim; DECISIONS.md D-64, D-65
two_levers:
  identity: cost_share = round_trip_cost / EXPECTED PROFIT per contract; size cancels
  lever_1_cost_share: 'For a BRACKET trade, set by the risk taken -- cost drag = cost / (stop_ticks x
    tick_value), which is the right comparison because the criterion e >= 0.10 is in units of risk. For
    a TIME-EXIT trade, set by the EXPECTED DIRECTIONAL PROFIT per contract (D-73). Either way costs are
    charged per contract and the denominator is earned per contract, so POSITION SIZE CANCELS: ''trade
    smaller to cut costs'' is wrong.'
  lever_2_daily_risk: contracts x stop_ticks x tick_value. Trades speed against the chance of hitting
    the floor, and does NOTHING to cost share.
  why_they_get_conflated: stop_ticks appears in both, which produces a false trade-off between cost and
    size where none exists.
