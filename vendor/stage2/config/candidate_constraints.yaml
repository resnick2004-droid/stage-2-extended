      ARE NOT STAFFABLE under the strict partition. They need the direction-lock fallback, which costs
      exactly the expressiveness the extra strategies were bought for. N=2/m=2 and N=5/m=1 fit as they
      stand, and N=5/m=1 IS design B.
    honest_conclusion: C is the right layout where it can be staffed; its natural size here is N = 2 with
      m = 2. Beyond that the GROUP SUPPLY, not the statistics, is the binding constraint.
