    multi-MLL frequency up to rho ~ 0.3. At rho = 0.5 the advantage closes: survival converges and B''s
    RTP-trigger frequency becomes the better of the two, because m*rho/[1+(m-1)rho] rises faster than
    rho.'
  why_pooling_raises_cross_account_correlation: Averaging away idiosyncratic variance leaves the common
    factor, so accounts sharing NO strategy still become more alike as each holds more. That is the cost
    C pays against B and it is why C's advantage is bounded in rho.
