criterion:
  edge_min: 0.1
  one_sided_lower_bound_min: 0.05
  net_of_costs: true
  out_of_sample: true
  source: CHARTER.md; propsim D-47; propedge.backtest.metrics
  applies_to_every_trade_shape: true
  time_exit_restatement: REFUSED (D-104, answering 2B R-02). The criterion is a settled stage-one input
    (propsim D-47) and applies unchanged to the time-exit shape at the fixed 2.0 multiplier. It is not
    restated per shape or in Sharpe terms. A restatement made after the measured sds showed the candidates
    failing it would move the bar to fit them. That the criterion implies a Sharpe above the plausibility
    ceiling for this shape is recorded as a finding, not a defect to be repaired.
  decision: DECISIONS.md D-104 (operator, 2026-09-24)
trade_shape:
  why_this_key_exists: Feasibility depends on the SHAPE of the trade, not only on its edge. A bracket
    trade resolves at a stop or a target, so its per-trade sd is pinned by geometry. A time-exit trade's
    is not and must be measured. Screening a candidate against the wrong section gives a wrong answer
    with no sign that anything is amiss -- which is why the sections name their shape instead of leaving
    it implied (D-45).
  shapes_covered:
  - bracket
  - time_exit
  bracket: feasibility.* -- stop and target both pre-placed; sd from geometry
  time_exit: time_exit.* -- exit on a clock; stop rarely hit; sd is empirical
feasibility:
  applies_to_trade_shape: bracket
  design: development + held-out confirmation; one test at z = 1.645 (D-13)
  sd_assumption: 1.5 x binary floor (1+R)sqrt(p(1-p)) -- AN ASSUMPTION, not measured
  data_window:
    source: AlgoSeek US Futures via QuantConnect Cloud
    url: https://www.quantconnect.com/docs/v2/writing-algorithms/datasets/algoseek/us-futures
    read: 2026-09-22 by Claude, from the page text
    starts: May 2009
    years: 17.4
    note: 'THE BINDING CONSTRAINT. Span is not how long a contract has existed, it is how much history
      can be obtained. ES has traded liquidly since ~2000 (26.7 y) but the data starts May 2009, so the
      usable single-market window is 17.4 y. Change the data source and this section changes: it is a
      vendor fact, not a constant of the problem. See D-39.'
    licence: Free inside QuantConnect Cloud for backtesting; a local download needs a paid licence, so
      raw bars stay in their cloud. What crosses into this repository is a trade log, not a price series
      (docs/PIPELINE.md).
  single_market_smallest_demonstrable_edge_by_R:
    1.5:
      smallest_demonstrable_edge: 0.15
      years_needed: 13.3
    2.0:
      smallest_demonstrable_edge: 0.2
      years_needed: 10.4
    3.0:
      smallest_demonstrable_edge: 0.2
      years_needed: 16.2
  single_market_obtainable_years:
    ES: 17.4
    MES: 6.7
    MNQ: 6.7
    NQ: 17.4
  cells_lost_to_the_data_window:
  - edge: 0.15
    R: 1.5
    cluster_factor: 2.0
    years_needed: 26.7
  - edge: 0.15
    R: 2.0
    cluster_factor: 1.0
    years_needed: 18.3
  - edge: 0.2
    R: 1.5
    cluster_factor: 3.0
    years_needed: 22.6
  - edge: 0.2
    R: 2.0
    cluster_factor: 2.0
    years_needed: 20.9
  frequency_tradeoff:
    rule: years scale as cluster_factor / trades_per_day
    cheapest_cell_years_at_1_trade_per_day: 29.8
    max_cluster_factor_for_edge_0.10_at_2_trades_per_day: 1.17
    note: More trades per day buys nothing if they are perfectly correlated within the day. The cheapest
      e = 0.10 cell needs 29.8 y at one trade a day (R = 1.5). Two trades a day bring that inside the
      17.4 y window ONLY while the cluster factor stays below 1.17 -- i.e. while the second trade is genuinely
      close to independent of the first. Two perfectly correlated trades a day (cluster factor 2) buy
      nothing at all.
  multi_market:
    design_effect: 1 + (k-1) * rho
    pooled_window_years: 17.4
    pooled_window_basis: AlgoSeek US Futures data start (May 2009), uniform across pool
    pooled_window_note: The pooled window used to be the SHORTEST contract history in the pool (19.7 y,
      from the 2006/07 Globex migrations), so every market added shortened it. The data start is the SAME
      for every contract AlgoSeek covers, so adding a market no longer costs span -- only correlation.
      Pooling is cheaper under this source, not dearer. See D-39.
    markets_needed_for_edge_0.10_by_R_and_rho:
      1.5:
        0.0: 2
        0.1: 2
        0.2: 3
        0.3: 3
        0.5: 6
      2.0:
        0.0: 3
        0.1: 3
        0.2: 4
        0.3: 6
        0.5: null
      3.0:
        0.0: 4
        0.1: 6
        0.2: null
        0.3: null
        0.5: null
    rho_is_an_assumption: true
    pooling_assumes_a_common_edge: Pooling assumes the SAME edge in every market. If it differs, the pooled
      mean estimates an average that may exist in no market. A pre-registration must TEST homogeneity,
      not assume it.
  spy_then_es_proxy:
    design: develop on SPY 1998-2009.4 (AlgoSeek US Equities), confirm on ES 2009.4-today (AlgoSeek US
      Futures)
    confirmation_years_pure_futures: 8.7
    confirmation_years_with_spy: 11.4
    cells_recovered:
    - edge: 0.15
      R: 2.0
      cluster_factor: 1.0
      confirmation_years_needed: 9.1
    - edge: 0.2
      R: 1.5
      cluster_factor: 3.0
      confirmation_years_needed: 11.3
    - edge: 0.2
      R: 2.0
      cluster_factor: 2.0
      confirmation_years_needed: 10.4
    reopens_edge_0.10_single_market: false
    assumption: 'SPY and ES track the same index but are not the same instrument: different trading hours,
      costs, contract size, dividend and financing treatment, microstructure and participant mix. The
      gain is CONDITIONAL on the proxy holding.'
    must_be_tested_not_assumed: A pre-registration using this design must declare the proxy as a hypothesis
      with its own pass/fail check, run on the post-May-2009 OVERLAP where both series exist, declared
      before the confirmation test. The overlap is part of the confirmation window, so the proxy check
      spends confirmation data and must be counted in k.
    if_the_proxy_fails: The development period was spent on a different problem, so the confirmation test
      becomes the FIRST look at the strategy on its actual instrument. That is a WEAKER design than the
      pure-futures split, not a stronger one.
    source: results/spy_proxy_design.csv; DECISIONS.md D-40
  source: results/feasibility_frontier.csv, results/multimarket_frontier.csv, results/spy_proxy_design.csv;
    D-36, D-37, D-39, D-40
time_exit:
  applies_to_trade_shape: time_exit
  example_combination: 'C-004: entry 14:30 CT, exit 15:00 CT, stop = max(2.0 x 30-min vol forecast, 40
    ticks), no target'
  why_the_bracket_frontier_does_not_apply: The stop sits at twice a forecast of the move being forecast,
    so it is rarely hit. The outcome in units of intended risk is a continuous quantity centred well inside
    +/-1, not the near-binary -1 / +R of a bracket. Its sd is not set by geometry and cannot be derived
    -- it has to be measured (D-43).
  sd_status: NOT MEASURED - parameterised; see D-43 for the method
  sd_range_reported_over:
  - 0.3
  - 0.4
  - 0.5
  - 0.6
  - 0.7
  - 0.8
  - 0.9
  - 1.0
  - 1.1
  - 1.2
  - 1.3
  - 1.4
  - 1.5
  - 1.6
  sd_estimation_method:
    estimand: 'sd of u_i = pnl_net_i / r_i, where r_i = max(2.0 x vol_forecast_30min, 40 ticks) x tick_value
      x contracts -- the INTENDED risk as the stop rule defines it. Net, not gross: the criterion is net.'
    data: development period only; the confirmation window stays untouched
    look_ahead: the forecast must be computable strictly before 14:30 CT; checked against timestamps by
      the data-integrity agent, not taken on trust
    estimator: sample sd with a 20-day moving-block bootstrap CI, because volatility regimes persist across
      days and an iid interval would be too narrow
    planning_figure: the UPPER 95% bound, not the point estimate. For an edge the conservative direction
      is down (D-04); for a dispersion it is up, because underestimating sd under-powers the confirmation
      test.
    diagnostics_that_can_invalidate_the_framing:
    - 'stop-hit rate: if the stop is not rarely hit, the outcome is bracket-like and this section is the
      wrong one'
    - fraction where the 40-tick floor binds, with sd estimated separately in floor-bound and forecast-bound
      days; a material difference makes the pooled sd a mixture
    - 'realised/forecast ratio: tests the forecast, not the outcome'
    - kurtosis
    - CLT adequacy, by bootstrapping the t-statistic's upper tail -- the sample-size formula assumes a
      normal mean and 30-minute returns are not
    frozen_before_confirmation: written into the pre-registration with the result file's sha256 before
      the confirmation test is registered; never re-estimated after confirmation data is seen
    may_not_be_used_to_choose:
    - the 2.0 stop multiplier
    - the 40-tick floor
    source: DECISIONS.md D-43
  sharpe_invariant:
    formula: conf_years = 4*cf*z^2*[1+(k-1)rho]/(k*S^2), S = (e/sd)*sqrt(252)
    sharpe_definition: S = (edge / sd) * sqrt(252), one trade per day
    note: 'e and sd CANCEL. The confirmation span depends only on the per-trade information ratio. Verified
      against the bracket frontier: e = 0.10 at R = 1.5 implies S = 0.853 and 14.9 years, which is what
      results/feasibility_frontier.csv gives independently.'
    criterion_is_not_scale_free_for_this_shape: e and sd are both in units of INTENDED RISK, which the
      stop rule sets. Halving the 2.0 multiplier doubles both, leaves S and every span unchanged, but
      moves e across the 0.10 criterion. So the multiplier and the tick floor are part of the CRITERION's
      definition for this shape, not free parameters, and a pre-registration must fix them before e >=
      0.10 means anything. This is a statement about what the criterion measures, NOT an argument for
      relaxing it.
  post_publication_confirmation:
    design: 'fully specified combination: confirmation = the entire post-publication window; development
      is used only to estimate sd (D-43, D-49)'
    superseded_design: development >= confirmation, an unjustified addition (D-49)
    confirmation_start_date: '2014-05-28'
    confirmation_start_status: Stage 2B input, not verified by this repository
    confirmation_window_years: 12.32
    confirmation_window_years_superseded: 8.73
    development_available_futures_only: 5.04
    development_available_with_spy_proxy: 16.41
    development_need_not_match_confirmation: For a fully specified combination development only estimates
      sd (D-43) and runs sanity checks, so it need not match the confirmation span. For any combination
      with parameters chosen on data the D-13 split rules still apply, and which case a candidate is in
      must be declared BEFORE the run.
    sd_estimation_adequacy:
    - extra_confirmation_span_fraction: 0.0663
      kurtosis: 3.0
      n_effective: 1270
      relative_se_of_sd: 0.0198
      serial_inflation: 1.0
      upper95_multiplier: 1.0326
    - extra_confirmation_span_fraction: 0.0944
      kurtosis: 3.0
      n_effective: 635
      relative_se_of_sd: 0.0281
      serial_inflation: 2.0
      upper95_multiplier: 1.0462
    - extra_confirmation_span_fraction: 0.1059
      kurtosis: 6.0
      n_effective: 1270
      relative_se_of_sd: 0.0314
      serial_inflation: 1.0
      upper95_multiplier: 1.0516
    - extra_confirmation_span_fraction: 0.1513
      kurtosis: 6.0
      n_effective: 635
      relative_se_of_sd: 0.0444
      serial_inflation: 2.0
      upper95_multiplier: 1.073
    - extra_confirmation_span_fraction: 0.1348
      kurtosis: 9.0
      n_effective: 1270
