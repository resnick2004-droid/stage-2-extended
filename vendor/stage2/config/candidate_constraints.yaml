era_dependence:
  rule: 'Raw points and bare tick counts NEVER enter a signal or a comparison across periods. Every signal,
    stop, effect and sd is held in scale-free units: returns, volatility-scaled quantities, or units of
    intended risk (D-75).'
  ticks_are_not_scale_free: A tick is a fixed price increment and price is not fixed. A 40-tick NQ stop
    is about 0.55% of price near 1,800 and 0.04% near 24,000. Tick counts are EXECUTION INSTRUCTIONS at
    a moment, not comparisons across 2009-2026.
  scale_free_no_change_needed:
  - sd in units of intended risk (D-43)
  - the edge e in units of risk (the criterion)
  - cost DRAG = cost / risk
  - the Sharpe identity S = (e/sd)*sqrt(252)
  - design effect, rho, cluster factor
  - the daily-risk limit as a FRACTION of the cushion
  era_dependent_now_labelled:
  - stop and floor widths in ticks (D-46)
  - cost-share thresholds in ticks (D-69, D-73) -- valid at one price level only
  - vehicle switching points (D-74) -- recomputed per era below
  the_floor_is_the_era_dependent_half: The volatility-scaled stop 2.0 x sigma_30 is scale-free; the FLOOR
    it is maxed against is not. So the stop rule is scale-free only while the forecast term binds, and
    the floor makes it era-dependent in QUIET regimes -- which is exactly when the floor binds.
  cost_share_by_price_level:
    6E:
      cost_share_at_low_price: 0.34286
      cost_share_at_high_price: 0.24828
      low_over_high: 1.38
    CL:
      cost_share_at_low_price: 1.12
      cost_share_at_high_price: 0.45818
      low_over_high: 2.44
    ES:
      cost_share_at_low_price: 0.89818
      cost_share_at_high_price: 0.16467
      low_over_high: 5.45
    GC:
      cost_share_at_low_price: 0.53091
      cost_share_at_high_price: 0.16686
      low_over_high: 3.18
    NQ:
      cost_share_at_low_price: 0.95556
      cost_share_at_high_price: 0.07167
      low_over_high: 13.33
  a_falling_cost_share_is_not_an_improving_edge: 'Cost share falls MECHANICALLY as price rises: the same
    return is more ticks in a higher market. NQ''s cost share is 13.3x heavier at the low price level
    than the high one. Any diagnostic reporting cost share by year must report PRICE ALONGSIDE it, or
    a rising market will be read as an improving edge.'
  required_subperiods:
  - 2014-2018
  - 2019-2021
  - 2022 onwards
  subperiods_are_pre_registered: Every pre-registration declares its subperiods IN ADVANCE and checks
    that the pooled result does not depend on a single one. A subperiod chosen after seeing the pooled
    result is not a robustness check, it is a second look.
  sd_stability_diagnostic: D-43 gains a diagnostic comparing sd in units of intended risk across development-period
    years. A material trend means the planning figure must account for it rather than averaging over it.
  structural_change_to_note: The post-2022 growth of same-day (0DTE) options is a structural change in
    intraday flow and bears directly on C-007's hedging mechanism. A pooled result spanning it must show
    the 2022-onwards subperiod separately.
  price_levels_are_illustrative: STATED REFERENCE POINTS, not measured history. This repository has no
    price data (T2). They show the SHAPE of the era dependence; the real levels arrive with the data.
  source: results/era_and_vehicle.csv; DECISIONS.md D-75
slippage_model:
  status: SPECIFIED, NOT ESTIMATED -- needs quote data (T2)
  conditioned_on:
  - instrument
  - vehicle (micro vs mini)
  - time of day
  - year
  estimated_from: QuantConnect quote data (bid-ask spread) on DEVELOPMENT-PERIOD data only; the cloud
    guard refuses any run reaching 2014-05-28
  why_each_condition:
    instrument: spreads differ by contract and by liquidity
    vehicle: a micro's spread in ticks is not a mini's; they are separate books
    time_of_day: each C-007 leg trades a different 30-minute window, and spread varies sharply across
      the session
    year: liquidity in 2009-2012 is not liquidity today, in either direction
  stop_slippage_modelled_separately: A stop is a market order once touched, so it pays the spread plus
    whatever the move through it costs. Around SCHEDULED ANNOUNCEMENTS that is a different distribution
    and is modelled separately, not averaged in.
  micros_before_may_2019: Micro E-minis launched 2019-05-06. Before that a micro's fills are SIMULATED
    FROM MINI DATA and must be labelled as such in any result -- it is an assumption about a contract
    that did not exist, not a measurement.
  validation_planned: Current-era estimates are validated against the trader's own fills once that export
    exists. Until then slippage remains the largest unmeasured driver of viability (config/fills.yaml).
  source: docs/PIPELINE.md; DECISIONS.md D-76
optional_tradability_filter:
  status: PRE-REGISTRABLE OPTION, not a default
  rule: Skip a leg when the bid-ask spread or the volume at that time of day falls outside a stated range.
  counts_in_k: It is an ENTRY CONDITION, so it counts as a variant in k and is declared in advance with
    its thresholds. Adding it after seeing which days lost money is the definition of a post-hoc filter.
  thresholds_must_be_absolute_not_relative: A threshold expressed as a percentile of the sample is fitted
    to the sample. State it in spread ticks and contracts at that time of day, per era.
  source: DECISIONS.md D-76
