daily_risk_lever:
  default:
    fraction: 0.125
    usd: 250.0
    status: 'WITHDRAWN as a default (D-114): a C-007-specific conduct number (D-50), not the campaign''s
      risk setting. The baseline is stage one''s admissible pairs below.'
  baseline_from_stage_one:
    source: vendor/propsim/edge/T5_RESULTS.md section 2a (pre-registered, admissible)
    combine:
      low_edge: 2:1 $750
      edge_at_or_above_0.10: 1.5:1 $500
    funded: 1.5:1 $1000
    rule: per-trade risk is set SEPARATELY for the Combine and the funded account, starting from these
      pairs, at R >= 1.5; the strategy test itself is size-free (u = pnl / intended risk)
    reconciliation_with_the_tier:
      decision: D-117 (answers 2B R-04)
      contracts: min(floor(pair_risk / (stop_ticks x tick_value)), headroom_cap)
      headroom_cap: '75 % of the CURRENT tier''s micro-equivalent allowance, rounded down: 15 micros at
        the 2-mini entry tier'
      why: 'RTP trigger 2 (help.topstep.com 13620045, verbatim: ''You max position a majority of your
        trades'') and the carried guardrail ''risk per position well below the maximum''. Sizing at the
        tier maximum is never the default.'
      consequence: 'the pair''s dollar risk is reached only when the stop is wide enough: at the entry
        tier the funded $1,000 needs an MES stop >= 54 ticks (1000 / (15 x 1.25)); below that the realised
        risk is capped and reported beside the intended pair'
      rtp_metric: share of trades sized at the tier maximum is reported and must stay below one half;
        with the headroom cap it is zero by construction
      status: a declared operating rule; the 75 % is swept in T7 (60-90 %) and scored on growth, ruin
        and latency, never on confirmation data
  t7_sweep_range:
    from: 0.125
    to: 1.0
    widened_by: D-70 (was 1/12 to 1/4 under D-54)
    run_separately_for:
    - combine
    - funded
    anchored_on: stage one's admissible pairs (D-114)
  principle: 'Every sizing, risk or protocol parameter starts from stage one''s contract-optimisation
    results and cites them. The prop structure is the context the execution model is built for: a strategy
    is sized to the contract, never the contract bent to the strategy (D-114).'
  t7_scored_on:
  - median log growth
  - ruin of the fee bankroll
  - payout latency
  - subscription cost
  - same-day multi-account loss-limit events
  barrier_free_reference_by_edge:
    0.05:
      kelly_fraction_barrier_free: 0.2
      kelly_usd_barrier_free: 400.0
      best_fraction_on_tested_grid: 0.25
      prob_floor_before_target_at_that_fraction: 0.18701
      prob_floor_before_target_at_default_eighth: 0.04044
    0.1:
      kelly_fraction_barrier_free: 0.4
      kelly_usd_barrier_free: 800.0
      best_fraction_on_tested_grid: 0.375
      prob_floor_before_target_at_that_fraction: 0.11417
      prob_floor_before_target_at_default_eighth: 0.00166
    0.15:
      kelly_fraction_barrier_free: 0.6
      kelly_usd_barrier_free: 1200.0
      best_fraction_on_tested_grid: 0.625
      prob_floor_before_target_at_that_fraction: 0.13953
      prob_floor_before_target_at_default_eighth: 7.0e-05
    0.2:
      kelly_fraction_barrier_free: 0.8
      kelly_usd_barrier_free: 1600.0
      best_fraction_on_tested_grid: 0.75
      prob_floor_before_target_at_that_fraction: 0.11417
      prob_floor_before_target_at_default_eighth: 0.0
  kelly_is_not_a_target: f* = e/sd^2 assumes NO absorbing barrier. The MLL is absorbing and takes the
    fees already paid with it. At e = 0.10 the barrier-free optimum is f = 0.40 ($800/day) and P(floor
    before target) there is 0.114, against 0.002 at the f = 0.125 default. Growth-optimal and survival-optimal
    are an order of magnitude apart in ruin, and the guardrail against account-deciding positions binds
    long before Kelly does.
  sd_assumption: 0.5 risk units, the D-44 reference point, NOT a measurement
  budget_sharing_when_an_account_holds_several_strategies: The daily limit is the ACCOUNT's, split across
    its m strategies at equal risk (D/m each), so the day's worst case is D whether m is 1 or 3 -- NOT
    D per strategy. Adding a strategy therefore buys diversification at CONSTANT risk, which is why C
    beats B per account (D-59), and it is why the limit is enforced at the account level rather than inside
    each strategy.
  source: results/cost_share_and_risk_levers.csv; DECISIONS.md D-70
cross_track_hedging_scheduler:
  status: HARD CONSTRAINT -- applies across BOTH tracks
  why: Article 13747047 prohibits opposing positions 'across multiple accounts' with no notion of which
    strategy or track placed them. Two accounts are two accounts. If Track Z were ever adopted (it is
    not -- D-66), both tracks would trade the same correlated groups in the same accounts.
  the_collision: C-007's ES leg holds the equity_index group 14:30-15:00 CT, and Track Z's Combine ridge
    and funded day-one all-in both want ES.
  rules:
  - TOKEN IS KEYED ON THE GROUP ALONE, never on (group, track). A Track Z request for equity_index while
    C-007's ES leg holds it is REJECTED, NOT QUEUED -- exactly as a same-track request would be.
  - PRECEDENCE IS PRE-REGISTERED, never resolved at run time, because resolving it live is a decision
    made after seeing the market. The EDGE TRACK holds priority on its pre-registered windows, since those
    are fixed in a pre-registration and moving them invalidates the test. TRACK Z YIELDS.
  - The scheduler publishes a BLACKOUT CALENDAR per group listing every window reserved by a pre-registered
    leg. Track Z may request a group only outside its blackout, and subject to the confirmed-flat and
    minimum-gap conditions.
  - 'TRACK Z''S FUNDED ALL-IN CANNOT SHARE A GROUP AT ALL: it is a day-one full-cushion position held
    for an unbounded time, so it can never guarantee to release the token before a scheduled leg opens.
    A group used by the all-in is DEDICATED to it for that account''s life.'
  - The pre-trade gate sees only accounts, groups and signs. It is NOT told which track an order came
    from, so it cannot be argued into an exception.
  source: DECISIONS.md D-55, D-71
conduct_guardrails_hard:
- winners larger than losers (R > 1)
- risk per position well below the maximum
- no single position that decides the account
- no fail-and-repurchase campaign
- no cross-account hedging -- see cross_account_hedging_prohibited for the construction rule; it is a
  hard invariant, not a guideline (D-55)
- no reliance on fills the market would not give
- no tight brackets or auto-breakeven that depend on favourable SIM fills
- not ranked or modified by detectability
conduct_source: CHARTER.md; propsim D-34/D-35/D-36; help.topstep.com 10305426, 10296582
rtp_triggers_to_avoid:
  max_positioning: '''You max position a majority of your trades'' is an RTP trigger'
  correlated_multi_account_mll: '''Multiple accounts hit the Maximum Loss Limit in one day'' -- a copier-correlated
    group satisfies this by construction (D-30)'
  source: help.topstep.com 13620045; DECISIONS.md D-27, D-30
what_a_candidate_must_arrive_with:
- 'a stated mechanism: who is on the other side and why they accept the loss'
- a prior from outside this dataset (literature, economic argument, market structure)
- its cost in k, declared in advance
- the development span it consumes
what_a_candidate_must_arrive_with_source: NEXT_STEPS.md T4; DECISIONS.md D-36
