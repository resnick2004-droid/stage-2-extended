stop_rule_is_part_of_the_criterion:
  applies_to_trade_shape: time_exit
  rule: The stop multiplier and the tick floor are fixed in the pre-registration and never tuned. A run
    that changes either is a NEW pre-registration with a new id.
  why: 'e and sd are both in units of intended risk, which the stop rule sets. Tightening the stop raises
    e without changing the strategy by one trade: the sample-size frontier does not move, but the candidate
    crosses e >= 0.10. A pass bought by arithmetic.'
  floors_are_per_instrument: A floor stops the rule demanding a stop narrower than that market's own noise,
    which is a property of the instrument, not of ES. 40 ticks of MES is $50; of ZN, $625; of M6E, $50
    but twice the price move of 40 ticks of 6E. One tick count copied across a pooled set imposes several
    different risk budgets while looking uniform. Express each floor in that instrument's own volatility
    or ticks.
  two_floors_binding_is_the_wider:
    cost_floor: narrowest stop keeping drag within the criterion; computable now
    volatility_floor: needs the per-instrument measurement in D-43; DOES NOT EXIST YET
  source: DECISIONS.md D-44, D-46
plausibility_rule:
  rule: A cell that fits its confirmation window only by implying a net annual Sharpe above the stated
    ceiling is NOT evidence in favour of a candidate.
  ceiling: 1.0
  ceiling_status: a stated judgement used to LABEL rows, never to filter
  superseded_verdict: Before D-49 this section read 'single-market post-publication confirmation is not
    pursued'. The design correction lengthened the window and the verdict softened from ruled out to marginal.
    Recorded rather than overwritten, because the rule did not change -- only what it implies.
  why_the_usual_reading_inverts: Normally the fitting cells of a feasibility table are the promising ones.
    Here a cell fits only by asserting a high per-trade information ratio, and these are PUBLISHED effects
    being confirmed on POST-PUBLICATION data, where the prior is decay toward zero rather than a sustained
    Sharpe above 1. Fitting the window is evidence the assumed sd is too optimistic, not that the candidate
    is strong.
  single_market_status: MARGINAL, not ruled out. Under the superseded design (D-49) it needed S >= 1.113,
    beyond the ceiling, and was ruled out outright. The 12.32-year window brings it to 0.937 -- ON the
    ceiling. It survives only where the fitting and plausible regions just cross, at the TOP of the stated
    sd range (sd >= ~1.59 at e = 0.10, against a 0.5 reference point), because a high sd is what makes
    a cell plausible and also what makes it expensive. A single-market design must therefore argue for
    a pessimistic sd AND the criterion edge at once.
  the_route: pooling across WEAKLY CORRELATED markets. The requirement falls as S >= 1.113*sqrt([1+(k-1)rho]/k),
    but at rho = 0.5 six markets still need 0.85 -- so the pool is chosen for independence, not merely
    for count.
  what_this_is_not: Not a relaxation of e >= 0.10, which is untouched, and not a licence to prefer whichever
    design implies a comfortable Sharpe. The ceiling labels rows and rules out a design class; it never
    filters rows inside a result file. Every cell and its implied Sharpe stay in the CSV so a reader can
    apply their own threshold.
  source: results/time_exit_frontier.csv; DECISIONS.md D-44, D-48
leg_schedule_and_daily_risk:
  why_this_supersedes_the_book_view: multi_market_sizing treats the pool as a simultaneous book sharing
    one allowance. The legs are in fact SEQUENTIAL -- each market's 30-minute window is anchored to its
    own CME daily settlement and the four settle at four different times -- so the position cap, which
    limits open positions at an instant, applies PER LEG. See D-50.
  settlement_source: cmegroup.com settlement-procedure pages, read 2026-09-23 by Claude
  flatten_ct: '15:10'
  legs:
  - cost_floor_ticks: 30
    market: GC
    risk_per_contract: 30.0
    settle_ct: '12:30'
    settle_window_source: 13:29:00-13:30:00 ET VWAP
    vehicle: MGC
    window: 12:00-12:30
  - cost_floor_ticks: 26
    market: CL
    risk_per_contract: 26.0
    settle_ct: '13:30'
    settle_window_source: 14:28:00-14:30:00 ET VWAP
    vehicle: MCL
    window: 13:00-13:30
  - cost_floor_ticks: 18
    market: 6E
    risk_per_contract: 22.5
    settle_ct: '14:00'
    settle_window_source: 13:59:30-14:00:00 CT VWAP
    vehicle: M6E
    window: 13:30-14:00
  - cost_floor_ticks: 20
    market: ES
    risk_per_contract: 25.0
    settle_ct: '15:00'
    settle_window_source: 14:59:30-15:00:00 CT VWAP
    vehicle: MES
    window: 14:30-15:00
  one_instant_of_contact: CL's exit and 6E's entry are both 13:30:00, so for one instant two positions
    are open. Enter 6E at 13:30:30, or budget CL and 6E jointly, and say which in the pre-registration.
  cap_per_leg_micro_equivalents: 20
  cap_is_not_a_risk_control_here: One leg at the full 20-micro cap risks ~$600 -- 30% of the cushion in
    a single leg, and four such legs would be 120% of it. The cap does not protect the account at this
    size.
  cushion_usd: 2000.0
  cushion_source: config/rules.yaml xfa_mll_start = -2000 (article verified 2026-09-22)
  mll_is_checked_intraday: Realised AND unrealised P&L count and the account is liquidated the moment
    Net P&L touches the limit, so the RUNNING TOTAL across sequential legs binds, not the end-of-day figure.
  daily_risk_limit:
    rule: the day's worst case -- every leg stopped -- must not exceed one eighth of the cushion
    fraction: 0.125
    usd: 250.0
    basis: 'the guardrail ''no single position decides the account'' applied to the day: for a day of
      sequential legs the day IS the position, and eight consecutive worst-case days are needed to exhaust
      the cushion'
    allocation:
      GC:
        vehicle: MGC
        contracts: 2
        leg_risk_usd: 60.0
        window_ct: 12:00-12:30
      CL:
        vehicle: MCL
        contracts: 2
        leg_risk_usd: 52.0
        window_ct: 13:00-13:30
      6E:
        vehicle: M6E
        contracts: 3
        leg_risk_usd: 67.5
        window_ct: 13:30-14:00
      ES:
        vehicle: MES
        contracts: 2
        leg_risk_usd: 50.0
        window_ct: 14:30-15:00
    day_worst_case_usd: 229.5
    day_worst_case_fraction_of_cushion: 0.1148
    risk_spread: 1.35
    days_to_2000_at_criterion: 87.1
  granularity_dominates_the_percentage: One micro per leg is $103.50 worst case and two is $207, with
    nothing between. A 10% limit ($200) forbids two-each by $7 and halves position size. The limit was
    set at one eighth rather than one tenth for that reason, and the reason is recorded because choosing
    a threshold to admit a position size is exactly the move that needs to be visible (D-50).
  stops_are_cost_floors: Each leg's stop is the narrowest keeping cost drag within 0.10. The volatility
    floor (D-46) needs the D-43 measurement and does not exist yet, so risk per contract here is a LOWER
    bound and these position sizes are UPPER bounds.
  source: results/leg_schedule.csv; DECISIONS.md D-50
cross_account_hedging_prohibited:
  status: HARD CONSTRAINT
  rule: For every correlated instrument group g and every instant t, the SIGN of the position in g is
    the same across all accounts. Zero is compatible with any sign.
  source_article: help.topstep.com 13747047 'Understanding Hedging', read 2026-09-23 by Claude (page text)
  verbatim_prohibition: Cross-account hedging is prohibited at Topstep -- 'simultaneously going long and
    short the same or correlated instrument across multiple accounts'.
  verbatim_why_monitoring_is_insufficient: '''Opposing positions are prohibited even if the overlap is
    brief or unintentional.'' Brief AND unintentional are both named, so this is not a guideline to honour
    on average, nor a monitor that unwinds breaches after the fact. A breach lasting one second during
    order transit is a breach.'
  verbatim_consequence: '''Accounts closed for hedging violations are not eligible for payouts, and any
    associated profits cannot be withdrawn''; such accounts ''cannot be reopened or reinstated''. Campaign-level,
    not per-trade.'
  correlated_groups:
    equity_index:
    - ES
    - MES
    - NQ
    - MNQ
    gold:
    - GC
    - MGC
    crude:
    - CL
    - MCL
    euro_fx:
    - 6E
    - M6E
    rates:
    - ZN
    base_metals:
    - HG
    - MHG
    natural_gas:
    - NG
    - MNG
    crypto:
    - MBT
    - MET
  why_all_equity_index_is_one_group: The article prohibits opposing positions in 'the same or correlated
    instrument' and does not define 'correlated', so the grouping is ours and the choice is ASYMMETRIC.
    Splitting ES from NQ when Topstep treats them as correlated risks account closure, payout ineligibility
    and forfeiture of unwithdrawn profit. Merging them when Topstep would have allowed a split costs only
    expressiveness. A wrong guess is recoverable in one direction and not in the other, so the conservative
    reading is taken without waiting for clarification (D-58).
  groups_are_a_design_constraint_not_a_formality: The partition gives each group to exactly one strategy,
    so the number of groups caps the number of strategies a partitioned layout can staff. See account_layout.staffing_constraint_that_binds.
  enforcement:
  - 'GROUPS NOT CONTRACTS: the page says ''or correlated instrument'', so the unit is a declared correlated
    group. ALL equity index futures (ES, MES, NQ, MNQ) are ONE group under D-58; the full list is in correlated_groups
    above.'
  - 'PRIMARY -- instrument partition: each group is assigned to exactly one strategy for the whole campaign,
    so two strategies never trade the same group and opposite positions cannot be constructed.'
  - 'FALLBACK -- direction lock: where a partition is infeasible, a campaign-level director holds one
    signed target per group; a strategy wanting the opposite sign is FLATTENED TO ZERO, never reversed.'
  - 'PRE-TRADE GATE: no order is routed unless the resulting sign matches the campaign sign for that group.
    A violating order is REJECTED, NOT QUEUED -- a queue reintroduces the brief overlap the article names.'
  - 'SEQUENCING: changing a group''s sign requires every account FLAT in that group first, with fills
    confirmed, before any reversing order is routed. Flatten-then-enter, never reverse-through-zero. This
    is the clause that handles ''brief or unintentional'', and it costs a round turn at every reversal
    which the cost model must carry.'
  interaction_with_allocation: A copier running ONE strategy across accounts satisfies the invariant automatically.
    Strategy-per-account is the allocation that needs this machinery.
  source: config/rules.yaml:cross_account_hedging; DECISIONS.md D-55
portfolio_of_strategies:
  design: pre-registered portfolio of k declared strategies; ONE pooled test at z=1.645
  confirmation_window_years: 12.32
  required_component_sharpe_by_k_and_rho:
    2:
      0.0:
        required_component_sharpe: 0.663
        plausible: true
        if_each_component_claimed_alone: 1.117
        decomposition_cost_multiple: 1.69
      0.2:
        required_component_sharpe: 0.726
        plausible: true
        if_each_component_claimed_alone: 1.117
        decomposition_cost_multiple: 1.54
      0.3:
        required_component_sharpe: 0.756
        plausible: true
        if_each_component_claimed_alone: 1.117
        decomposition_cost_multiple: 1.48
    3:
      0.0:
        required_component_sharpe: 0.541
        plausible: true
        if_each_component_claimed_alone: 1.213
        decomposition_cost_multiple: 2.24
      0.2:
        required_component_sharpe: 0.64
        plausible: true
        if_each_component_claimed_alone: 1.213
        decomposition_cost_multiple: 1.89
      0.3:
        required_component_sharpe: 0.684
        plausible: true
        if_each_component_claimed_alone: 1.213
        decomposition_cost_multiple: 1.77
    4:
      0.0:
        required_component_sharpe: 0.469
        plausible: true
        if_each_component_claimed_alone: 1.277
        decomposition_cost_multiple: 2.73
      0.2:
        required_component_sharpe: 0.593
        plausible: true
        if_each_component_claimed_alone: 1.277
        decomposition_cost_multiple: 2.15
      0.3:
        required_component_sharpe: 0.646
        plausible: true
        if_each_component_claimed_alone: 1.277
        decomposition_cost_multiple: 1.98
    5:
      0.0:
        required_component_sharpe: 0.419
        plausible: true
        if_each_component_claimed_alone: 1.326
        decomposition_cost_multiple: 3.16
      0.2:
        required_component_sharpe: 0.562
        plausible: true
        if_each_component_claimed_alone: 1.326
        decomposition_cost_multiple: 2.36
      0.3:
        required_component_sharpe: 0.622
        plausible: true
        if_each_component_claimed_alone: 1.326
        decomposition_cost_multiple: 2.13
  multiplicity:
    pooled_claim_costs_nothing_in_z: Declaring k strategies in advance and testing ONE pre-specified pooled
      statistic is a single test at z = 1.645. k is paid in DATA, through the design effect 1+(k-1)rho,
      not in the critical value.
    component_claim_costs_the_full_bonferroni: Claiming any individual component is a second look and
      needs z at 0.05/k, which raises the per-component Sharpe requirement by 1.4x to 2.5x. A design must
      declare IN ADVANCE whether it claims the portfolio or the components.
    selection_cost: k is the number of variants TRIED, not kept, and it is spent on the development period
      under D-13, not on confirmation.
  per_component_checks:
  - claim_status: DIAGNOSTIC - reported, not claimed, unless the Bonferroni z is paid
    name: per_component_lower_bound
    rule: every component's one-sided 95% lower bound is reported beside the pooled result
    stops: a pooled pass carried by one component while the rest are flat or negative
  - claim_status: PRE-REGISTERED PASS/FAIL - declared before the run
    name: minimum_positive_components
    rule: at least ceil(k/2) components must have a point estimate above zero
    stops: a portfolio 'edge' that is one strategy plus noise
  - claim_status: PRE-REGISTERED PASS/FAIL - the decisive check
    name: leave_one_out
    rule: the pooled result must still pass with the single best component removed
    stops: the strongest component carrying the claim on its own
  - claim_status: PRE-REGISTERED PASS/FAIL - same requirement D-37 places on markets
    name: homogeneity
    rule: Cochran's Q across component edges; a rejection means the pooled mean estimates an average that
      may exist in no component
    stops: pooling heterogeneous things and reporting the average as if it were shared
  - claim_status: CONSTRUCTION - not a test, a constraint on the statistic
    name: equal_weighting_enforced
    rule: components are weighted equally in risk, fixed in advance, never fitted
    stops: an implicit optimisation that turns the test into a selection
  - claim_status: CONSTRUCTION
    name: direction_declared
    rule: each component's direction (long/short bias) is fixed in the pre-registration
    stops: a component silently flipping sign to fit, and cross-account hedging (D-55)
  the_failure_these_guard: 'A pooled mean can pass on one live component while the rest are dead. leave_one_out
    is decisive: if the result does not survive removing the best component, it is a single-strategy finding
    and must be reported as one.'
  rho_is_an_assumption: Cross-strategy correlation is NOT measured. Estimate it on development data before
    any pooled claim, exactly as D-37 requires for markets.
  source: results/portfolio_frontier.csv; DECISIONS.md D-56
