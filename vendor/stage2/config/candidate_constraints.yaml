  portfolio_per_account_wins_per_account: theta_A/theta_B = k/[1+(k-1)rho] exactly, so A always wins per
    account when rho < 1 -- pass ratio 1.10 to 1.44 across the grid.
  strategy_per_account_wins_campaign_survival: P(at least one account passes) is higher for B in every
    cell, by up to +0.073, most at low Sharpe and high rho, because its failures are imperfectly correlated.
  A_is_slower_because_it_succeeds_more: 'Both allocations have the same daily drift, so A is not faster
    -- it is slower. A race that runs to +$3,000 takes longer than one stopped at -$2,000, so raising
    the pass rate raises expected duration: A resolves in 1.5-2.7 years against B''s 1.2-1.5. A buys certainty
    and pays in time, which is exactly what D-14''s time-aware objective prices.'
  neither_dominates_on_conduct: A puts identical positions in every account, so one bad day hits every
    MLL at once -- the first named RTP trigger (D-30), satisfied BY CONSTRUCTION. B breaks that correlation
    but lets different strategies take opposite sides of one instrument in different accounts, which is
    the prohibited hedge (D-55). The choice is which prohibited state you engineer against.
  assumptions:
    brownian_continuous_barrier: Daily P&L is treated as Brownian with continuously monitored barriers.
      The MLL IS monitored intraday, so continuous monitoring is right in kind, but drift and volatility
      are calibrated to DAILY aggregates, so within-day excursions are not modelled. That makes every
      survival figure here OPTIMISTIC.
    constant_rho: Correlation is constant and known. It is neither; it is an assumption.
    copula_for_joint_failure: Joint failure across accounts uses a one-factor Gaussian copula on the fail
      indicator at the stated correlation, by deterministic quadrature. The copula is a modelling choice,
      not a measurement.
    equal_edges: Every component is given the same Sharpe. If they differ, the pooled portfolio's advantage
      is smaller than shown and the leave-one-out check in results/portfolio_frontier.csv becomes the
      binding diagnostic.
    no_consistency_rule: The Combine consistency rule (max share of profit from one day) is NOT modelled.
      It can only reduce pass probability, never raise it.
    sd_in_risk_units: sd = 0.5 risk units, the D-44 reference point, NOT a measurement. Daily sigma =
      $125 follows from the $250 daily limit (D-50, provisional).
    static_floor: The MLL is modelled as a fixed barrier $2,000 below the start. It actually TRAILS upward,
      so after a gain the floor is $2,000 below the new peak, not below the start. The static model is
      therefore OPTIMISTIC again for any path that rises before it falls.
  figures_are_optimistic: 'Continuously monitored STATIC barriers calibrated to DAILY aggregates: this
    misses within-day excursions against an intraday-monitored limit, and ignores the MLL''s upward trail.
    Both point the same way. Treat every probability as an upper bound.'
  source: results/account_allocation.csv; DECISIONS.md D-56
portfolio_claim_rule:
  status: HARD CONSTRAINT on pre-registration
  rule: 'A multi-strategy pre-registration claims the PORTFOLIO: one pre-specified pooled statistic, tested
    once at z = 1.645, with the five per-component checks attached. COMPONENT-LEVEL CLAIMS ARE NOT MADE.'
  why: The pooled claim is a single test and costs nothing in z; claiming components individually needs
    z at 0.05/k and raises the per-component Sharpe requirement by 1.4x to 2.5x. Paying that must be decided
    BEFORE seeing which components worked, and the honest way not to decide it afterwards is not to reserve
    the option.
  leave_one_out_is_decisive: 'A design whose pooled result does not survive removing the single best component
    is REPORTED AS A SINGLE-STRATEGY FINDING, not a portfolio one, and carries the multiplicity cost of
    having tried k. That is the outcome this rule exists to force: the alternative is reporting one live
    strategy plus noise as a diversified edge, which is true of the arithmetic and false about the world.'
  components_remain_as_diagnostics: Per-component figures stay in the result file. What is forbidden is
    CLAIMING them.
  source: DECISIONS.md D-56, D-57
