    per unit of price captured differs, so the VEHICLE is itself a cost lever (D-74).'
  never_compare_ticks_across_different_tick_sizes: 'In own-ticks 6E looks only 1.2x cheaper than M6E.
    That is an artefact: M6E''s tick is 0.0001 against 6E''s 0.00005, so a ''tick'' is not the same price
    move on the two contracts. Per unit of PRICE captured 6E is 2.37x cheaper. Use a common price unit
