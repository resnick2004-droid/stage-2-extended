# Signal atlas family A2 (D-481): family A1's grid with each cell sized by FV3-C's kind of state table, re-solved on the
# cell's own trades -- declared before any A2 campaign runs. P-11's audit (D-477) found A1's shortfall against FV3-C's
# development row in the plan's zero-edge money, not the edge: FV3-C's table extracts more of the contract than
# T24-GF15b's fixed plan. The table could not be used on T24's stop maps until its mixed-rung fault was fixed (D-480).
#
# Everything but the plan is A1's (config/atlas_a1.yaml, D-460, D-461, D-469): the walk is A1's cache, read as it is.
# Every cell is one trial in N; the pool also counts A1's screens, T24's selection steps and the FV3 rows whose search
# chose the table's configuration (D-189; the gatekeeper rules at registration).
status: fixed
decision: D-481
family: A2
walk_family: A1                     # A1's walk, unchanged: the same grid, brackets, delays and map (D-481 (1))
market: NQ
bars: local                         # data/bars/NQ (D-458), read through config/windows.yaml (D-459)
development:
  start: "2020-01-01"
  end: "2026-07-16"                 # NQ's spent held-back year folded into development (D-461); the reserve unread
contract: {ticker: NQ, tick: 0.25, point_value: 20.0, micro: MNQ, micro_point_value: 2.0}
day:
  first_decision_ct: "17:00"        # events from the session's open (slot 0: T24's first slot) ...
  last_decision_ct: "14:00"         # ... to 14:00 CT: a 40 to 60-point bracket needs the afternoon (D-212)
  flatten_ct: "15:10"
entry_delays_min: [0, 5]            # walked: on time (R149-R151's identity) and five bars late
screen_delay_min: 5                 # screened: five bars late only -- the operator's manual entry (D-428 (1)); the
                                    # automated track (D-399) is no faster than the modelled latency
slip_ticks: 1                       # one tick adverse at entry and at an end (D-95); the screen costs the rest
side_rules: [follow, fade]          # trade the event's direction, or against it -- both walked from one capture;
                                    # the clock pattern takes T24's seeded coin instead (COIN_SEED 20261025), one cell
brackets:                           # T24's twelve (config/t24_capture.yaml), so the clock pattern is R149-R151's identity
  - [20, 20]
  - [30, 20]
  - [40, 20]
  - [60, 20]
  - [40, 40]
  - [60, 40]
  - [80, 40]
  - [120, 40]
  - [60, 60]
  - [90, 60]
  - [120, 60]
  - [180, 60]
stop_maps: [m40]                    # T24's m40 (D-432, D-433: it led): each event hour's stop the widest to 40 points
                                    # at which 1:1 resolves (at most 5 % unresolved on normal days, overall and every
                                    # year), every R offered there that resolves
cells: "15 patterns x 2 side rules + the clock's coin = 31 cells, each one trial in N (D-189)"
patterns:                           # ids are positions; definitions in atlas_core's docstring
  - {name: clock_t24, kind: clock}  # T24's 23 decision slots, both sides -- the null family and R149-R151's identity
  - {name: brk15, kind: brk, k: 15}
  - {name: brk30, kind: brk, k: 30}
  - {name: brk60, kind: brk, k: 60}
  - {name: inside15, kind: inside, k: 15}
  - {name: inside30, kind: inside, k: 30}
  - {name: nbar15x4, kind: nbar, k: 15, n: 4}
  - {name: nbar15x8, kind: nbar, k: 15, n: 8}
  - {name: orb_rth5, kind: orb, open_ct: "08:30", m: 5}
  - {name: orb_rth15, kind: orb, open_ct: "08:30", m: 15}
  - {name: orb_rth30, kind: orb, open_ct: "08:30", m: 30}
  - {name: orb_globex30, kind: orb, open_ct: "17:00", m: 30}
  - {name: orb_london30, kind: orb, open_ct: "02:00", m: 30}
  - {name: pdhl, kind: pdhl}        # the prior trading day's 08:30-15:10 CT high and low
  - {name: engulf15, kind: engulf, k: 15}
  - {name: engulf30, kind: engulf, k: 30}
plan: table                         # FV3-C's solver (config/state_policy_v12.yaml's rules, rent fixed point and export;
                                    # D-329 to D-336) re-solved on each cell's own trades, as scripts/t24_exec.table_policy
                                    # does (D-432 (3)): one rung a stop of the cell's map at its share of the cell's trades,
                                    # each R's availability the share of the rung's trades offering it, the menu $200 to
                                    # $2,000 in $50 steps at R 1, 1.5, 2 (the Combine at R >= 1), skip and abandon, the
                                    # D-325 rules; at the edge cell nearest the lowest of the cell's R's one-sided bounds
                                    # (t24_wide.edge_cell, FV3-C's convention); the oracles first -- a cell whose table
                                    # fails one is recorded REFUSED and not ranked (D-429). The campaign otherwise as A1's:
                                    # strictly one position at a time (D-429), five accounts, FV3-C's fidelity switches,
                                    # the day capacity raised to a cell's busiest day (D-469)
screen:
  paths: 150                        # the Studio's convention for screens; the verdict runs 500
  seed: 20261030                    # A1's: common random numbers, so each cell's plan is the only difference
  rank: "growth on the required bankroll at each R's one-sided 95 % bound (the gate row), highest first, among the
         cells whose table passes its oracles and whose offered R's resolve"
  carry: "the top cell goes to the development verdict at 0.05/N; every cell is reported, A1's gf15b row beside it;
          a top cell that cannot beat FV3-C's development row at the screen is still carried -- the verdict and the
          scoreboard decide (D-460's rule, unchanged)"
news:
  fomc: [config/im2_release_calendar.csv, config/sources/fomc_statements_2020_2024q1.csv, config/sources/fomc_statements_2026q3.csv]
  bls: [data/release_days_0830_2009_2025.csv, data/release_days_0830_2026.csv]
  bls_cut_ct: "07:30"
