# The account-state risk policy of the two-stream candidate FV3-G/F (D-338, D-339): config/state_policy_v12.yaml with
# ONE addition -- the flip stream's action in the funded menu (`funded_flip`): a scheduled direction-neutral bracket at
# the measured statistics of the no-edge bracket study on record (development data), offered every day, sized to the
# $150 winning-day rule (its $250 at 1:1 nets about $215-240 after costs). The table prices it against the strategy's
# actions by value: its edge is its own (read from the file, never the cell's), its availability one (a bracket is
# always offered), its risk exactly as declared (two MNQ at the $125-a-micro bracket; no rung). The Combine's menu is
# untouched (no winning-day rule). Export version 13: every leaf names its source. A NEW solve (the funded table
# changes; the Combine's reproduces v10's). EXPLORATORY and engine-only. The result: results/state_policy_v13.csv and
# its policies file.
decision: D-339
script: scripts/state_policy_dp.py
module: propedge/campaign/state_policy.py

outcomes:
  model: "stage one's binary process: p = (1 + e) / (1 + R), the same e at every R (propsim D-06); a trade risking more than the room above the floor is raced against the floor by the engine's p_race / theta_from_edge (floor_mode truncate, edge_mode drift) -- under the room cap a Combine trade never does; a realised win is rounded to the $50 grid and its probability read at the R the grid makes of it, so every action is exactly fair at zero edge; D-318: an action's R offered at each rung on its availability share of days, no trade otherwise (fair: no trade moves nothing); D-339: the flip action's p from its own measured net edge at every cell, offered every day"
  edges: [-0.05, -0.025, 0.0, 0.025, 0.05, 0.10]     # D-290's grid, unchanged

rules: "rules_for_method('aeropay') from config/rules.yaml -- the verified ledger; D-289: the Standard path, no placement"
horizon_days: 504
slot_rent_per_day: fixed_point                       # D-329: lambda* per edge (see the header); D-291's $25 was a cell tried, never derived
rent_fixed_point:
  start: 25.0                                        # the first round's rent (D-291's); each later edge starts from the previous edge's lambda*
  tolerance: 0.25                                    # dollars per slot-day: converged when the rate the policy earns is within it of the rent it was solved at
  max_rounds: 10

menu:                                                # the funded leg's menu (v5's, unchanged)
  step: 50.0
  risks: [250, 500, 750, 1000, 1500, 2000]
  rrs: [1.0, 1.5, 2.0, 2.5, 3.0]
  skip: true

funded_flip:                                         # D-339: the flip stream's action (funded menu only)
  risk: 250.0                                        # two MNQ at the $125-a-micro bracket: $250 at risk, $250 to win
  rr: 1.0
  source_file: results/nq_noedge_campaign.csv        # the no-edge bracket study on NQ at today's price level, 2009-2019 (D-225 to D-228; development data)
  row: {section: inputs, leg: combine, year: pooled, R: 1.0, stop_dollars: 125.0}   # the pooled row of the 1:1 $125 bracket
  edge_field: e_net                                  # its net edge per attempt (the target share, the stop share, an open bracket a full loss, less the cost)
  lower_bound_field: e_net_lower_bound               # the one-sided 95 % bound over its eleven yearly blocks (the engine's lower-bound arm reads it)
  availability: 1.0                                  # a scheduled bracket is always offered; the table's availability for it is one

combine_menu:                                        # D-316's, unchanged
  risks: [250, 500, 750, 1000, 1500, 2000, 2500, 3000]
  rrs: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 2.5, 3.0]
  min_rr: 0.25

rungs:                                               # D-306's, with D-318's availability
  file: results/fv3_rung_shares_2020.csv
  availability_file: results/fv3_rung_availability_2021.csv   # D-318: from results/fv3_studio_portfolio_v3_point_trades.csv (D-310's declared cell under the fidelity protocol's fixed stops, every quarter R carried), 2021 on
  phase: all
  stops_ticks: {half: 50, full: 100, double: 200}
  tick_value: 0.5
  combine_cap_micros: 50
  funded_caps: {0: 20, 1500: 30, 2000: 50}
  exit_grid: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]

combine_rules:                                       # D-313's two rules, unchanged; D-329's tie-break and abandon
  room_cap: true
  consistency_cap: true
  tie_break_tol: 5.0                                 # among the trades within $5 of the state's best value, the higher R
  tie_prefer: high_rr
  abandon: true                                      # the attempt cancelled at the close that decides it (8284121; D-334), worth 0, the slot freed; taken exactly where nothing beats it

funded_rules:                                        # D-325's two rules, unchanged; D-329's abandon
  tie_break_tol: 5.0                                 # among the trades within $5 of the state's best value, the smallest dollar risk (no trade the smallest); the flip's key is its risk
  profit_risk_cap: 500.0                             # once the balance is above its start (every paid state), no action risks more than $500
  abandon: true                                      # the XFA closed at the trader's request (10657969 -- its terms unstated, D-336 (ii)), nothing credited, worth 0, the slot freed; taken exactly where nothing beats it

funded:
  balance_cap: 6000.0
  payout_grid_step: 50.0

objective: "expected cash from one attempt within the horizon: the Combine's subscription accrued per trading day (subscription / billing_days), the activation at a pass, net payouts (profit split, the method's fee), less the slot rent per account-day -- the rent lambda* per edge (D-329); an abandoned account pays no rent from the day it is dropped; no credit for survival"

baselines:                                           # the fixed legs under the same allowance, the Combine's two rules and the availability, at lambda*; neither the funded rules, abandon nor the flip applies to a fixed leg
  - {name: s1_1to1_1500, combine_rr: 1.0, combine_risk: 1500, funded_rr: 1.5, funded_risk: 1000}
  - {name: s1_1p5to1_1000, combine_rr: 1.5, combine_risk: 1000, funded_rr: 1.5, funded_risk: 1000}
  - {name: fv3_fresh, combine_rr: 0.75, combine_risk: 2000, funded_rr: 3.0, funded_risk: 2000}   # D-317's v5 fresh geometry

oracles:                                             # CLAUDE.md: a value outside a ceiling is an engine error (abandon only lowers a pass probability and pays nothing; the oracle's funded table is solved without the flip, whose edge is its own)
  zero_edge_no_fees_max_p_pass: 0.327131
  zero_edge_no_fees_p_pass_1to1_1500: 0.32653061224   # 16/49 (the fixed geometry without rungs or rules: the contract's own oracle)
  zero_edge_no_fees_max_gross_payouts: 2000.0

export:
  balance_band: 250.0
  cushion_band: 250.0

campaign_check:                                      # D-290 (8): the engine's own binary campaign (its draw takes no need, so neither exit, the room cap, the availability nor the flip applies there -- D-317: not a test of this table)
  accounts: 5
  combines: 5
  bankroll: 5000
  horizon_days: 504
  n_paths: 500
  payout_method: aeropay
  seed: 20261016
  fixed_legs: {combine_rr: 1.5, combine_risk: 1000, funded_rr: 1.5, funded_risk: 1000}
