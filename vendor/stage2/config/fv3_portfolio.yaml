#   python scripts/score_fv3_grid.py --declaration D-321 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v7
# D-321's run (results/fv3_portfolio_v7.csv, D-323: continue; two defects fixed under D-324 behind switches, off by
# default). Under D-325 (the operator, 2026-10-08: "Proceed with the next steps as you see best fix to solve the issues
# we have been failing to resolve") the funded table is solved under two rules -- among the actions within $5 of a
# state's best value the smallest dollar risk, and once the balance is above its start no action beyond $500 at risk
# -- against the erratic funded accounts of the operator's Studio review (a flat optimum; bold play below the payout
# line); its export corrected under D-326 (the unpaid balance band split at the start: version 9); and D-324's two
# switches are on: each trade's fee at the contracts it holds, and a policy's no-trade state holding only a
# Standard-path funded account. A new candidate (D-277); D-321's on record beside it. Run once, from a clean tree,
# after the v9 table:
#   python scripts/score_fv3_grid.py --declaration D-326 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v8
# D-326's run (results/fv3_portfolio_v8.csv, D-327: continue; the Studio mirror exact on the verdict arm, D-328). Under
# D-329 (the operator, 2026-10-09: "We need to measure how much $ a day is worth ... if it's better to just start
# over") -- the LAST protocol change before the confirmation -- the slot rent is derived as the campaign's cash rate
# per slot-day (lambda*, the fixed point over the Combine -> XFA chain), both tables may abandon an account (a Combine
# cancelled, an XFA closed at the trader's request; verified 2026-10-09), the Combine breaks ties toward the higher R,
# the efficiency measures (cash per slot-day, slot-days per attempt and per XFA, the shares abandoned) are reported
# beside every result, and D-328's cent rounding of the policy's decision inputs is on. Table version 10. A new
# candidate (D-277); D-326's on record beside it. Then the protocol is frozen. Run once, from a clean tree, after the
# v10 table:
#   python scripts/score_fv3_grid.py --declaration D-329 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v9
# D-329's run (results/fv3_portfolio_v9.csv, D-332: continue by the lines, every magnitude below v8's): the audit found
# the exported policy file closing funded accounts the table never decided to close -- a visited-bands-only export,
# the engine inheriting a neighbouring band's abandon for near-fresh accounts (the same class as D-322, D-326). Under
# D-332 (a defect reopens the protocol) the export is corrected (version 11: every band carries the table's own
# decision) on the SAME v10 solve, the policy file checked against the exact table on real trades before the run,
# and the run repeated once. Run once, from a clean tree, after the v11 export:
#   python scripts/score_fv3_grid.py --declaration D-332 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v10
# The v11 file's check before the run (the replay on real trades; the Studio's policy map) found one more artefact
# (D-333): the funded balance cap's band carried the table's boundary abandon into the engine; version 12 leaves it
# out. The same solve re-exported once more; the run as declared, on the v12 files:
#   python scripts/score_fv3_grid.py --declaration D-333 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v10
# D-333's run (results/fv3_portfolio_v10.csv, D-334: continue by the lines; every number the lines read exact; the v9
# defect gone; the magnitudes at v8's level). The audit's one engine error (finding 3): the engine read the abandon at
