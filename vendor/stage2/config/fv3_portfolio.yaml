# not name. This is the corrected declaration for the single pre-registered rerun of the SAME candidate (the operator's
# decision, 2026-10-06, D-308): every feasibility condition the scorer applies is written below, the flatten ceiling
# is D-212 (2)'s as the operator amended it (5 %) with its reason, the inert terms are live or gone, the mechanics eras
# and the benchmark stop follow this file -- and no candidate parameter, target, stop or portfolio line is changed from
# D-306. D-308's run (results/fv3_portfolio_v2.csv, D-309: continue) left two findings in the declaration's execution
# -- the first test year untraded for want of a selection statistic one development year cannot give, and D-47's
# criterion unstated -- corrected under D-310 (the operator takes (b)): the one cell is taken in every feasible test
