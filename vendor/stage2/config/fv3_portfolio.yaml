# D-310's run (results/fv3_portfolio_v3.csv, D-311: continue) stated a $5,000 bankroll, which bound and censored the
# required figure; under D-312 (the operator, 2026-10-07) the bankroll is an output of the run -- cash that never binds,
# the required bankroll reported, growth read on it. Under D-313 (the operator, 2026-10-07) the Combine gains two rules
# -- a trade never risks more than the room above the floor; a day that cannot pass closes at the consistency
# allowance -- and the state table is re-solved within them (version 4): a NEW CANDIDATE (D-277), D-310's on record
# beside it; the planned D-312 re-read of D-310's candidate is superseded and not run. Run once, from a clean tree:
#   python scripts/score_fv3_grid.py --declaration D-313 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v4
# Under D-316 (the operator, 2026-10-07: "openly test higher risk options and negative RR trades") the Combine gets its
# own menu in the state table (v5: risks to $3,000, R from 0.25) -- a further change before D-313's run, which is
