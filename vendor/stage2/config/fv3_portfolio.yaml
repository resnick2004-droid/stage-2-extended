#   python scripts/score_fv3_grid.py --declaration D-316 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v5
# That run was launched and stopped before it wrote anything: a diagnostic of the same gate (the operator's question why
# accounts take so long) found Combines that could never trade again and never fail -- room below one micro at any stop
# offering their R -- holding every slot. Under D-318 (the operator, 2026-10-07: "A + B + C") such a Combine ends out of
# room, the router hands a trade only to an account that can take it, and the state table learns each rung's
# availability by R (version 6). D-316's run is superseded and not run. Run once, from a clean tree, after the v6 table:
#   python scripts/score_fv3_grid.py --declaration D-318 --config config/fv3_portfolio.yaml --result-name fv3_portfolio_v6
# D-318's run (results/fv3_portfolio_v6.csv, D-319: continue). Under D-321 (the operator, 2026-10-08: "we need to fix
# all the errors and issues before considering running the OOS tests") two errors the operator's Studio review found are
# corrected before any confirmation: the funded export keyed only by balance and cushion, so a paid account below its
# payout line traded the band's most-visited $250 whatever its winning days (the table sizes up there) -- export
# version 7 keys it by winning days and the payout-line band; and every trade charged one median cost priced as a stop
# exit, so a target exit paid a tick it never pays -- `fidelity.costs: per_trade`. A new candidate (D-277); D-318's on
