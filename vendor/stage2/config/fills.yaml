        derived floor 1.72 (D-209).
    M6E:
      value: 1.00
      article_id: 8284213
      url: https://help.topstep.com/en/articles/8284213
      date_read: 2026-10-01
      verified_by: rules-verifier (stage two)
      status: verified
      quote: '"Micro EUR/USD (M6E)" | "$1.00"'
      note: not named in the 2026-10-01 exchange-fee notice. Read before 2026-09-26, $1.00; re-read 2026-10-01, unchanged
    MNG:
      value: 1.92
      article_id: 8284213
      url: https://help.topstep.com/en/articles/8284213
      date_read: 2026-10-01
      verified_by: rules-verifier (stage two)
      status: verified - the page's stated total (table, "Total Round-Turn Cost (RT)")
      quote: '"Micro Henry Hub Natural Gas (MNG)" | "$1.92"'
      note: >-
        Stated total equals D-209's derived floor (1.92), so the loaded value is unchanged. It
        decomposes into the NEW exchange fee: $1.40 ("MNG: $0.60 to $0.70 per side ($1.40 round
        turn)") + "$0.02 round turn" NFA + "Micros $.50 round turn" commission. The page does not
        say in words that the table includes the increase; the table figure is the stated total.
        Read before: 2026-09-26, $1.72, verified; 2026-09-30, table still $1.72, loaded at the
        derived floor 1.92 (D-209).

  # Announced on the same page, read 2026-09-26, again 2026-09-30 and again 2026-10-01 (still
  # shown each time, same wording). LOADED from 2026-09-30 as the derived totals below (D-209;
  # P-04 section 3's fallback); from 2026-10-01 the page's table STATES the same totals.
  scheduled_changes:
    - effective: 2026-10-01              # "the October 1, 2026 trading day" (CME trading day)
      products: [MCL, MNG]
      article_id: 8284213
      date_read: 2026-09-26
      last_read: 2026-10-01              # notice still shown, wording unchanged
      quote: |
        "Exchange fee increase starting the October 1, 2026 trading day"
