# config/fills.yaml — fill model parameters
#
# Loaded by propedge/execution/fills.py.
#
# EVERY value in `assumed` is an ASSUMPTION placed here so the code runs. None of them is
# measured. They must be replaced by measured values (T2 in NEXT_STEPS.md) before any result
# is reported, and each replacement records its source and date.
#
# Why this matters more than it looks: the criterion is e >= 0.10 NET. Stage one measured a
# gross edge and treated commissions as negative edge; the whole point of stage two's fill
# model is that the gap between gross and net is where a candidate dies. An optimistic
# slippage assumption does not make a candidate look slightly better - it can move it across
# the criterion. Slippage is in TICKS and commission is per CONTRACT PER SIDE (D-03); never
# express either as a fraction of dollar risk.
#
# The `zero_cost` profile is the validation limit: zero slippage, zero commission, exact
# fills. With it the fill model must return exactly the binary P&L, which is what lets
# tests/test_fills_zero_cost_limit.py and tests/test_adapter_reproduces_stage_one.py show
# that stage two reduces to stage one. Do not edit the zero_cost profile.

meta:
  active_profile: assumed          # which profile propedge loads by default
  generated: 2026-09-21

# Per-instrument ROUND-TURN cost per contract, all-in (commission + exchange + NFA fees).
#
# This field exists because a single flat commission across contract sizes is not merely
# imprecise, it points the wrong way on the question it is used to answer. A flat $1.44 applied
# to both a $12.50-tick ES and a $1.25-tick MES hands minis a free 10x cost advantage; the real
# ratio is about 3:1. Cost drag decides candidate viability, so the comparison has to be right.
#
# Values verified 2026-09-22 from help.topstep.com article 8284213 ("TopstepX - Commissions and
# Fees"), read directly by the session: "ES $3.78 | MES $1.22 | NQ $3.78 | MNQ $1.22" round turn;
# commission alone is "$1.00 round turn ($0.50 per side)" for minis and "$.50 round turn ($0.25
# per side)" for micros, plus an NFA fee of "$0.02 round turn ($0.01 per side)".
#
# MCL, M6E and MNG added 2026-09-26 (D-158) by the rules-verifier from the same article, read
# directly: table columns "Product" | "Total Round-Turn Cost (RT)"; rows "Micro Crude Oil (MCL)" |
# "$1.52", "Micro EUR/USD (M6E)" | "$1.00", "Micro Henry Hub Natural Gas (MNG)" | "$1.72". The
# same read found ES/MES/NQ/MNQ unchanged. Per-instrument quotes are under `provenance` below.
#
# SCHEDULED CHANGE, NOW IN EFFECT: the same article announces a CME exchange-fee increase on MCL
# and MNG "starting the October 1, 2026 trading day" (quoted under `scheduled_changes` below).
# RE-READ 2026-09-30 (D-209, the operator's instruction that the fee change not pause scoring):
# the page still showed the notice and stated no post-change total; its table figures ($1.52,
# $1.72) decomposed exactly into the old exchange fees. So `values` carried P-04 section 3's
# fallback, the derived floors MCL 1.72 and MNG 1.92 (table figure + $0.20 round turn, from the
# page's own components).
# RE-READ 2026-10-01 (rules-verifier; page marked "Updated yesterday", i.e. 2026-09-30): the table
# now STATES "Micro Crude Oil (MCL)" | "$1.72" and "Micro Henry Hub Natural Gas (MNG)" | "$1.92",
# exactly the derived floors, and decomposes into the NEW exchange fees ($1.20 / $1.40 round turn
# + $0.52). `values` is unchanged; MCL and MNG are now the page's stated totals, not derivations.
# ES $3.78, MES $1.22, NQ $3.78, MNQ $1.22 and M6E $1.00 unchanged. The notice is still shown,
# same wording.
#
# PROVISIONAL: these are the broker's published figures, not measured fills. Replace with values
# measured on a funded test account, then change `source` below.
round_turn_by_instrument:
  source: help.topstep.com article 8284213, read 2026-09-22 (ES, MES, NQ, MNQ), 2026-09-26 (M6E), 2026-09-30 (MCL, MNG at P-04's derived floors, D-209) and 2026-10-01 (MCL, MNG at the page's stated totals; ES, MES, NQ, MNQ, M6E re-read unchanged) (published schedule, not measured)
  values:
    ES: 3.78
    MES: 1.22
    NQ: 3.78
    MNQ: 1.22
    MCL: 1.72
    M6E: 1.00
    MNG: 1.92

  # Not read by propedge.execution.fills (which reads only `values` and `source`): the record
  # behind the three rows added 2026-09-26. Article: https://help.topstep.com/en/articles/8284213
  # ("TopstepX - Commissions and Fees", marked "Updated this week" when read 2026-09-26 and
  # 2026-09-30, "Updated yesterday" when read 2026-10-01; the absolute timestamp was not read).
  # The composition text below was re-read 2026-10-01, same wording.
  provenance:
    composition: |
      The table's figure is all-in. Page text: "Round-Turn (RT) cost: charged when you complete
      both sides of a trade. Each side (Buy or Sell) incurs half the total, also called a 'per
      side' fee." The Round-Turn Cost Breakdown lists Exchange Fee ("Exchange fees are set by the
      exchange and do not include the regulatory fee. Each varies by product."), NFA Regulatory
      Fee ("$0.02 round turn ($0.01 per side)") and Commissions ("Minis $1.00 round turn ($0.50
      per side)"; "Micros $.50 round turn ($0.25 per side)"). No clearing fee is mentioned.
    MCL:
      value: 1.72
      article_id: 8284213
      url: https://help.topstep.com/en/articles/8284213
      date_read: 2026-10-01
      verified_by: rules-verifier (stage two)
      status: verified - the page's stated total (table, "Total Round-Turn Cost (RT)")
      quote: '"Micro Crude Oil (MCL)" | "$1.72"'
      note: >-
        Stated total equals D-209's derived floor (1.72), so the loaded value is unchanged. It
        decomposes into the NEW exchange fee: $1.20 ("MCL: $0.50 to $0.60 per side ($1.20 round
        turn)") + "$0.02 round turn" NFA + "Micros $.50 round turn" commission. The page does not
