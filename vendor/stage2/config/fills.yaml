        "MNG: $0.60 to $0.70 per side ($1.40 round turn)"
        "That's $0.10 more per side. Deducted automatically and shown in your trade activity."
      loaded: true                       # D-209, 2026-09-30: as the derived floors; 2026-10-01: the page's stated totals
      # As derived 2026-09-26/30 (kept as the record): the page did not say whether the table
      # already included the increase. Its own components said it did not: MCL $1.52 - $0.50
      # micro commission - $0.02 NFA = $1.00 exchange RT = $0.50/side (the "from" figure); MNG
      # $1.72 - $0.52 = $1.20 RT = $0.60/side (the "from" figure). On that reading the totals
      # from 2026-10-01 were the table figure + $0.20 RT. The "($1.20 round turn)" and "($1.40
      # round turn)" in the notice are the new EXCHANGE fee alone, not the new total.
      derived_total_round_turn_after:
        MCL: 1.72
        MNG: 1.92
      # Re-read 2026-10-01: the table states the post-change totals, equal to the derivation.
      stated_total_round_turn_after:
        MCL: 1.72                        # "Micro Crude Oil (MCL)" | "$1.72"
        MNG: 1.92                        # "Micro Henry Hub Natural Gas (MNG)" | "$1.92"
      stated_date_read: 2026-10-01
      derived_status: CONFIRMED as stated totals 2026-10-01 - the page's table reads "Micro Crude Oil (MCL)" | "$1.72" and "Micro Henry Hub Natural Gas (MNG)" | "$1.92", equal to the derived floors loaded 2026-09-30 (D-209); values unchanged. Before 2026-10-01 these were arithmetic on the page's quoted components, unverified as stated totals

profiles:

  zero_cost:
    description: >
      Validation limit. Zero slippage, zero commission, exact fills at the stop and target.
      Reproduces stage one's binary model exactly. Used by tests. DO NOT EDIT.
    status: exact                  # not an assumption: this profile is definitionally zero
    entry_slippage_ticks: 0.0
    stop_slippage_ticks: 0.0
    target_slippage_ticks: 0.0
    flatten_slippage_ticks: 0.0
    gap_through_stop: exact        # fill at the stop price even if the market gapped past it
    commission_per_contract_per_side: 0.0
    exchange_fees_per_contract_per_side: 0.0

  zero_cost_gap_fill:
    description: >
      Reconciliation stage A reference (D-83, docs/PIPELINE.md section 5). Zero slippage and zero
      commission, but a stop the market GAPS through fills at the next available price, as
      PIPELINE.md section 2 requires -- never at the stop price. Targets need a strict
      trade-through. It differs from zero_cost in exactly those two rules; zero_cost stays the
      stage-one reproduction profile and is not edited.
    status: exact                  # definitionally zero cost; not an assumption
    apply_round_turn_by_instrument: false   # zero cost means zero: no per-instrument fees
    entry_slippage_ticks: 0.0
    stop_slippage_ticks: 0.0
    target_slippage_ticks: 0.0
    flatten_slippage_ticks: 0.0
    gap_through_stop: next_price
    require_trade_through_for_target: true
    commission_per_contract_per_side: 0.0
    exchange_fees_per_contract_per_side: 0.0

  assumed:
    description: >
      Placeholder cost model. Every number here is an assumption to be replaced by a measured
      value in T2. Do not report a result computed with this profile without saying so.
    # D-95: the operator has no measured fills and has instructed that costs be assumed or taken
    # from published sources. The profile stays FLAGGED AS AN ASSUMPTION (the ASSUMED marker is
    # read by propedge.execution.fills), so every result computed with it says so.
    status: ASSUMED - operator instruction 2026-09-24 (D-95); fees from the published Topstep schedule, slippage assumed

    # Slippage in TICKS, per side, adverse by convention (a positive number always costs money).
    entry_slippage_ticks: 1.0
    # A stop is a market order once touched, so it is the most adverse of the three.
    stop_slippage_ticks: 1.0
    # A target is a resting limit: it fills at the limit price or not at all, so slippage is 0
    # but the fill is not guaranteed. `require_trade_through` below is the honest version.
    target_slippage_ticks: 0.0
    # The 15:10 CT flatten is a market order into the close.
    flatten_slippage_ticks: 1.0

    # What happens when price gaps past the stop rather than trading through it.
    #   exact         - fill at the stop price (OPTIMISTIC; forbidden outside the zero_cost
    #                   profile because it is the SIM-fill exploitation the firm prohibits)
    #   next_price    - fill at the next available price after the gap (realistic)
    gap_through_stop: next_price

    # A resting limit target is only filled if price trades strictly through it, not merely
    # touches it. false would assume a fill on a touch, which flatters every result.
    require_trade_through_for_target: true

    # Per contract per side, in USD. Commission is the broker's; exchange fees are the
    # exchange's and are charged separately on most platforms. They are listed apart so the
    # rules-verifier / T2 can source them separately.
    commission_per_contract_per_side: 0.35
    exchange_fees_per_contract_per_side: 0.37

    sources:
      entry_slippage_ticks: ASSUMED (D-95) - one tick adverse on a market entry, conservative for ES/NQ in RTH
      stop_slippage_ticks: ASSUMED (D-95) - one tick adverse; stops are market orders once touched
      target_slippage_ticks: ASSUMED (D-95) - resting limit fills at the limit; strict trade-through required
      flatten_slippage_ticks: ASSUMED (D-95) - one tick adverse into the 15:10 CT flatten
      commission_per_contract_per_side: SUPERSEDED - fees are charged from round_turn_by_instrument (Topstep 8284213, published schedule)
      exchange_fees_per_contract_per_side: SUPERSEDED - included in round_turn_by_instrument (Topstep 8284213)
