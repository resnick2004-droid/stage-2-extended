# config/data_sources.yaml — facts about the QuantConnect data source, with their provenance
#
# This is NOT the rules ledger. `config/rules.yaml` holds firm rules read on the official Topstep
# help centre; this file holds facts about the vendor's data and server: dataset membership,
# start dates, the continuous-contract roll rule, resolution, and the MCP server version (D-78).
#
# Same discipline as the ledger. `propedge/data/sources.py` loads this file and RAISES if code
# asks for a fact whose status is not "read". A fact is "read" only with its full provenance:
#
#   what_read   - what was actually read (the response field, the log line, the tool output)
#   method      - how: `mcp_tool` (a tool call in an agent session), `api_script` (a committed
#                 script calling the QuantConnect API) or `manual_run` (a committed kit in
#                 runs/<run-id>/, run by hand in the web editor and ingested; D-82)
#   identifier  - the tool name; the script path plus the run's ids; or runs/<run-id> plus the
#                 QuantConnect project and backtest ids
#   date_read   - the date it was read
#   read_by     - who or what read it
#
# `requires` fixes the method in advance. Dataset facts accept `api_script` or `manual_run`
# (D-82), never `mcp_tool`: an answer whose only provenance is an agent conversation has no
# manifest (docs/QUANTCONNECT_MCP.md). The server version is a property of the running
# container, so it requires `mcp_tool`.
#
# Status values (must match docs/DATA_SOURCES.md):
#   read     - answered from the source, with full provenance below.   USABLE.
#   unread   - not yet read. Value is null.                            NOT usable.
#
# docs/DATA_SOURCES.md is GENERATED from this file: `python scripts/gen_data_sources.py`.
# `tests/test_data_sources_agreement.py` fails if the two drift.

meta:
  record: docs/DATA_SOURCES.md
  vendor: QuantConnect (AlgoSeek datasets, cloud only; D-39)
  generated: 2026-09-23

facts:

  # ------------------------------------------------------------ MCP server
  mcp_server_version:
    question: Version of the running quantconnect/mcp-server container
    requires: mcp_tool
    value: "0.0.10"
    status: read
    what_read: >
      The tool's response body, {"result":"0.0.10"}.
    method: mcp_tool
    identifier: mcp__quantconnect__read_mcp_server_version
    date_read: 2026-09-23
    read_by: Claude Code agent session (claude-opus-5-5), at the user's instruction
    note: >
      Running image quantconnect/mcp-server:latest, launched from .mcp.json (commit 48e0d35).

  mcp_latest_server_version:
    question: Latest published quantconnect/mcp-server version, to compare with the running one
    requires: mcp_tool
    value: "0.0.10"
    status: read
    what_read: >
      The tool's response body, {"result":"0.0.10"}.
    method: mcp_tool
    identifier: mcp__quantconnect__read_latest_mcp_server_version
    date_read: 2026-09-23
    read_by: Claude Code agent session (claude-opus-5-5), at the user's instruction
    note: >
      Equal to mcp_server_version: the running container is the latest release, so the notebook answer below describes the current server, not a stale one.

  mcp_notebook_tools:
    question: Which research-notebook tools, if any, the running server exposes (QUANTCONNECT_MCP.md §4)
    requires: mcp_tool
    value: "none"
    status: read
    what_read: >
      The tool list the running 0.0.10 server advertised to the session (tools/list), searched for jupyter/notebook/research/cell. It advertises 51 tools besides the 15 live-trading names denied in .claude/settings.json; none is jupyter_create_cell, jupyter_execute_cell, jupyter_read_notebook or any other notebook tool.
    method: mcp_tool
    identifier: tools/list of the running server at version 0.0.10 (see mcp_server_version); ToolSearch over it
    date_read: 2026-09-23
    read_by: Claude Code agent session (claude-opus-5-5), at the user's instruction
    note: >
      Resolves docs/QUANTCONNECT_MCP.md section 4 in favour of the repository tool list: the docs page's Research category is not exposed by server 0.0.10. create_file accepts .ipynb content, so a notebook file can be written, but nothing can execute a cell. Measurements therefore run as backtests recording statistics, as already assumed. Re-read if the server version changes.

