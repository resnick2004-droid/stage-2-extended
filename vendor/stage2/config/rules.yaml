      EARLIER RECORD (2026-09-22): Re-read 2026-09-22, unchanged. 8284197: "Yes. There's no limit to the number of Trading
      Combines you can have." 8284121: "Yes - no limit on how many you can have at once."
      Also 8284121: no time limit for passing.
      VALUE IS THE STRING 'unlimited', not null: propedge/contract/rules.py deliberately raises
      on a rule marked verified with a null value, so a fact that IS established needs a
      non-null sentinel to be expressible. Callers must treat 'unlimited' as no cap.

