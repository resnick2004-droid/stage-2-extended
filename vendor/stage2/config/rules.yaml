  combine_consistency_boundary_note:
    value: at_or_below
    units: text
    status: verified
    article_id: "8284208"
    url: https://help.topstep.com/en/articles/8284208-consistency-at-topstep
    date_read: 2026-10-10
    verified_by: rules-verifier (stage two), report only; recorded by the session under D-336
    note: >
      Two wording differences between the official pages, with the engine's comparison stated: (1) the boundary --
      8284208 "Your single best day of profit must stay at or below 55% of your Profit Target" and "55% is a hard
      line. It is not rounded, and there is no buffer." and "as long as no single day exceeds 55%", against 8284197
      "your best single day should stay below 55% of your Profit Target" -- a best day at exactly 55.000 % is met under
      8284208 and not under 8284197; (2) the denominator -- 8284208 uses "55% of your Profit Target" and "55% of your
      total profit" interchangeably ("Best Day Profit / Total Profit = Best Day %"; "Best Day / 0.55 = Total Profit
      Needed"), 8284197 the Profit Target only; they coincide only when total profit equals the target at the pass.
      Values unchanged: 55 % Combine, $3,000 target on 50K, the 3:10 PM CT lock, "Losses don't reset your best day";
      XFA Consistency path 40 % not rounded, "A minimum of 3 trading days with at least 1 trade per day", the
      calculation reset to $0 after a payout request. THE ENGINE applies combine_consistency_max_day_frac (0.55) as
      8284208 reads: the effective target is max(profit target, best day / 0.55) (propedge/campaign/lockstep.py,
      CombineAccount.need_to_pass, passes, day_allowance), so a best day at exactly 55 % of the target raises nothing
      (at-or-below), and the denominator is the effective profit target, which equals total profit at the pass.

