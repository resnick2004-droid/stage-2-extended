# config/rules.yaml — machine-readable copy of RULES_LEDGER.md
#
# `propedge/contract/rules.py` loads this file and RAISES if code requests a rule
# whose status is not "verified". That is the enforcement of the charter rule
# "nothing may depend on a rule whose status is not verified".
#
# Status values (must match RULES_LEDGER.md):
#   verified                          - read on the official help centre, id + url + date below.  USABLE.
#   carried_from_stage_one_reverify   - stage one verified it; not re-read in stage two.          NOT usable.
#   unverified_human_input_required   - needed by stage two, never verified.                      NOT usable.
#   third_party                       - non-official source. Never sufficient.                    NOT usable.
#
# Edit via `/verify-rule <rule>` (the rules-verifier agent), which writes the value,
# article id, url and date here and in RULES_LEDGER.md together, and appends to DECISIONS.md.
# Hand-editing this file without updating RULES_LEDGER.md puts the two out of sync;
# `tests/test_instruments.py` and `/close-check` compare them.

meta:
  ledger: RULES_LEDGER.md
  official_domains:                  # rules-verifier will not accept any other host
    - help.topstep.com
    - topstep.com
  generated: 2026-09-21

