      EARLIER RECORD (2026-09-22/23), kept for history:
      Verified 2026-09-22. Table quoted verbatim: "Account Size | Max Contracts | Max Micros" /
      "$50K | 5 | 50". And: "Micros and minis count at a 10:1 ratio." Also "The Micro to Mini ratio
      functionality is available for the Trading Combine and Express Funded Account. It is not
      currently available for the Live Funded Account." No soft/recommended tier exists; the only
      softening sentence is "You're never required to trade the maximum. Fewer contracts is always
      allowed."
      VERIFIED 2026-09-23 (D-52), no longer a working reading. PRIMARY SOURCE: article 8284223 defines the allowance on the page that sets it, verbatim - "Example - $50K XFA, 2-lot Scaling Plan: 2 Minis, OR 20 Micros, OR Any combo equal to 2 Minis". CORROBORATION: the trader confirmed 10:1 first-hand from the platform on 2026-09-23. Two independent readings of different kinds - an official page and a first-hand observation - agreeing, which is the standard D-35 asks for. The blog below is therefore SUPERSEDED, not merely outweighed; both readings stay on record because a retracted-in-practice source that is still published can mislead a later reader. Removed from the support list. Originally:  the scaling-plan page 8284223 defines the allowance itself, verbatim - "Example - $50K XFA, 2-lot Scaling Plan: 2 Minis, OR 20 Micros, OR Any combo equal to 2 Minis". That is the official definition of what the allowance MEANS, stated on the page that sets it, and it is 10:1. It also settles a second question: "Any combo" makes the cap AGGREGATE across instruments, not per instrument. The blog conflict below is left on the record and is on the support list in docs/HUMAN_INPUTS.md; work proceeds on 10:1 rather than blocking. CONFLICT ON THE RECORD: topstep.com/blog/new-permitted-products-offered-at-topstep (published
      2026-01-14, an official domain) says the opposite — "Each Micro futures contract equals a full
      contract toward your max position size in the Trading Combine and the Funded Account" and "if
      you are trading in a 50K Trading Combine, your max position size is 5 contracts, so 5 Micro
      contracts will max you out." That is a 10x difference in expressible risk. The help centre is
      preferred as the rules authority and is the later source (the 10:1 statement is repeated in
      8284223, dated 2026-07-16), but the blog is not retracted. See DECISIONS.md D-23.
      NOTE: this is the COMBINE cap and is NOT the binding constraint — funded_scaling_plan is, and
      it is unverified.

