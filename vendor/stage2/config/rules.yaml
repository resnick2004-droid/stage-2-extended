  hold_expiry_days:
    value: not_required_under_d34
    units: text
    status: verified
    article_id: null
    url: null
    date_read: 2026-09-22
    verified_by: design decision D-34, not a firm rule reading
    note: >
      NOT REQUIRED UNDER D-34, and therefore not an open blocker.
      D-34 caps the campaign at 5 concurrent accounts INCLUDING Combines, so the account cap can
      never be reached while a Combine is still running: a pass cannot queue behind a full slate
      because the slate is bounded by the same 5. The hold queue is unreachable by construction,
      so its expiry has no effect on any modelled outcome.
      THIS IS A DESIGN FACT, NOT A RULE READING. The firm's behaviour is still unknown - no
      official page states whether a held pass expires - and the question is parked in
      PARKING_LOT.md. It becomes live again the moment D-34 is relaxed, or if a protocol is
      considered that runs more Combines than funded slots. Any such protocol must re-open this
      before it can be simulated.
      The value is a sentinel rather than a number so that code reading it fails visibly if it
      ever expects days: propedge/contract/rules.py would otherwise hand out a null.

