  responsible_trading_program:
    value: true
    units: boolean
    status: verified
    article_id: "13620045"
    url: https://help.topstep.com/en/articles/13620045
    date_read: 2026-10-30
    verified_by: rules-verifier (stage two); re-read 2026-10-01, page text fetched three times (bare-id URL twice with differently worded prompts, slugged URL once cache-busted), identical wording each time; re-read 2026-10-30 by rules-verifier (two fetches, D-490 (4), D-494)
    note: >
      RE-READ 2026-10-30. THE PAGE WAS EDITED AGAIN AFTER 2026-10-01 (it shows "Updated over 2 weeks ago"; on
      2026-10-01 it showed "Updated today"). Re-read verbatim and UNCHANGED: the six triggers ("Multiple accounts
      hit the Maximum Loss Limit in one day"; "You max position a majority of your trades"; "You don’t keep losers
      smaller than winners"; "You don’t use stops"; "You go full port or trade on tilt, FOMO, or revenge"; "You
      disrespect your daily limits"); "50K accounts = -$1,000"; the warning FAQ in full; "How long does RTP last?"
      in full; "Your existing Standard XFA account is unaffected." / "Any new XFAs created during RTP will be
      Consistency XFA only"; the FTP/RTP account-limit sentences; "a Trader may be moved from RTP to FTP if they
      continue to violate our Trader Pledge" / "or carry out the other prohibited trading strategies outlined
      here."; "Traders in RTP can request payouts of up to $6,000 every 3 trading days"; the Live-exit sentence.
      CHANGED WORDING (no change to the modelled consequence): "Any Standard Trading Combine subscription started
      before RTP placement will remain as a Standard Trading Combine," / "and No Activation Fee Trading Combines
      will remain as No Activation Fee Trading Combines." / "If passed, the Trading Combine may be activated as
      either a Standard XFA or Consistency XFA." Not previously quoted: "In fact, compared to the prior Focused
      Trader Program, RTP allows more flexibility, not less."; "Yes, Traders in RTP can Reactivate their Express
      Funded Account using our Back2Funded option." Trigger 1 is still undefined (no count, no day definition).
      10406542 ("What is Responsible Trading?", August 13, 2026), re-read: the RTP list unchanged ("Hit the Maximum
      Loss Limit on multiple accounts in 1 day"; "Max position the majority of your trades"; "Let losers run bigger
      than winners"; "Trade without stops"; "Go full port, trade on tilt, FOMO, or revenge"; "Disrespect your daily
      limits"); in the page's Do's and Don'ts list, under No: "Use MLL as a stop loss"; "Maximum position size is a
      tool, not a default setting."; under "A few things that'll get you flagged:" the first item is "Excessive
      purchases of Trading Combines® or Resets". "Use MLL as a stop loss" is a Don't, not a placement trigger -- but
      it names the bold-funded play of D-490 (4)/D-494 directly.
      EARLIER RECORD: RE-READ 2026-10-01 (D-218 (A), after the RTP-trigger diagnostic; D-219). THE PAGE WAS EDITED
      AFTER THE LAST READ: on 2026-10-01 it shows "Updated today"; on 2026-09-27 it showed a
      last-updated date of 2026-07-21. Every passage quoted on 2026-09-22/27 is still on the page
      word for word (UNCHANGED, below). The page ALSO carries passages that no record in this
      repository quotes (NEW 1-5). The page cannot show whether they came in the latest edit or
      were there and went unrecorded. This read went through the fetch tool's page-to-text
      conversion (three fetches), not the raw HTML.
      NEW 1 - HOW RTP ENDS. FAQ "How long does RTP last?", verbatim: "There's no set timeline — it
      depends on you. To move through the Responsible Trader Program, here's what needs to happen:"
      / "1. Get to the Live Program. First, you need to qualify and start trading in a real, Live
      Funded Account (LFA)." / "2. Make $10,000 in profit in your Live Funded Account. Once you're
      live, you build that Live Funded Account's balance by $10,000 in profit. This profit must come
      from trading in the Live Funded Account itself, not from a Trading Combine or an Express Funded
      Account. How fast you reach this depends on how consistent and disciplined your trading is." /
      "3. Once you reach Live with $10K in profit, you'll be moved out of RTP." The page names no
      other way out: no course, no time period, no count of days or trades, no review on request and
      no support contact.
      NEW 2 - AFTER REMOVAL. "If you're removed from RTP with an active Consistency XFA:" - "Your
      Consistency XFA account stays unchanged" / "Going forward, you can choose a Standard or
      Consistency XFA for new accounts". NOT STATED: whether Combines bought after removal carry the
      DLL. The page states the DLL only "While in the Responsible Trading Program".
      NEW 3 - LIVE AND RTP. The page says (after a warning-sign icon) "Please note: Traders moved from
      the Live program voluntarily or due to the account breaching the Loss Limit and closing may be
      placed in the Responsible Trading Program (RTP)." The same sentence is on 10657969 (Live Funded
      Account Parameters, which also shows "Updated today" on 2026-10-01; read twice). That page
      also says: "When the call-up comes, all Express Funded Accounts (XFA) close."; "The restriction
      is only on activation — a passed Trading Combine cannot be activated into an Express Funded
      Account while your Live Funded Account is active."; "Once the Risk Team determines you're
      ready, your options are to move to Live or close your Express Funded Account." WHAT THIS MEANS
      HERE: the only published exit runs through a Live Funded Account. The Risk Team decides when a
      trader is ready for one, it closes every XFA when it comes, and no XFA can be activated while
      it is active. So in a campaign of XFAs with no Live leg, RTP placement lasts to the end of the
      campaign. The engine's consequence stands, but the reason it gives ("the completion criteria
      are not published", lockstep.py ConductModel) is no longer true.
      NEW 4 - PLACEMENT FOLLOWS A REVIEW. The triggers are introduced with "You may need the
      Responsible Trading Program if:". FAQ "Will I always receive a warning before being put in
      RTP?", verbatim: "While warnings will often be sent out first, Topstep reserves the right to
      send Traders directly to RTP based on the severity of the violation. Traders are only placed
      into RTP after thorough reviews from our Risk Team. Trading activity is monitored over time, and
      placement occurs only if we continue to see patterns that suggest unsustainable or high-risk
      behavior. If you're put into RTP, you will be notified directly via email." The page publishes
      no threshold, count or time window. Placing a trader the next day after a single trigger day is
      the strictest reading the page allows (direct placement "based on the severity of the
      violation"). It is not the process the page describes as usual.
      NEW 5 - ESCALATION AND ACCOUNT COUNT. "Under the Focused Trader Program, Traders are limited to
      one Express Funded Account at a time. Under the Responsible Trading Program, Traders may trade
      up to five Express Funded Accounts while following a consistency requirement during payout
      periods." / "However, a Trader may be moved from RTP to FTP if they continue to violate our
      Trader Pledge or carry out the other prohibited trading strategies outlined here." The FTP is
      not modelled.
      SCOPE IS PER TRADER. The trader is the one placed: "you may be placed in the Responsible
      Trading Program (RTP)"; "Traders are only placed into RTP after thorough reviews"; "If you're
      put into RTP, you will be notified directly via email". The consequences attach to every new
      account: "All new Trading Combines® and XFAs automatically get a Daily Loss Limit (DLL):".
      Purchases FAQ: "You can purchase any size and type of Trading Combine — there's no limit on how
      many you can hold. Each one will automatically have a Daily Loss Limit. For Express Funded
      Accounts, there's an additional restriction: once you pass a TC while in RTP, you'll be placed
      on the Consistency path rather than Standard." The page does not say whether the per-account
      triggers (2-6) are judged per account or across all the trader's accounts.
      TRIGGER 1 IS NOT DEFINED. 13620045 says "Multiple accounts hit the Maximum Loss Limit in one
      day". 10406542 ("What is Responsible Trading?", dated August 13, 2026; read twice) says "Hit
      the Maximum Loss Limit on multiple accounts in 1 day". Neither page says how many accounts
      "multiple" means, whether "day" is the trading day or the calendar day, or whether Combines and
      XFAs are counted together. The engine counts two or more accounts of either kind in one
      engine day. That is an assumption (D-145), not a reading.
      TRIGGER 3 IS WORDED TWO WAYS. 13620045 says "You don’t keep losers smaller than winners".
      10406542 says "Let losers run bigger than winners". The two differ when losers equal winners,
      as in a 1:1 bracket: the trigger fires under the first wording but not the second. The engine
      follows the first. 10406542's own sentence is "If we see habits that won't hold up in Live
      markets, we'll put you on the Responsible Trading Program."
      UNCHANGED SINCE 2026-09-22/27, re-read verbatim on 2026-10-01. Under "Responsible Trading
      Program Parameters" / "While in the Responsible Trading Program:" - "All new Trading Combines®
      and XFAs automatically get a Daily Loss Limit (DLL):" / "50K accounts = -$1,000" (also "100K
      accounts = -$2,000", "150K accounts = -$3,000"); "Pass a Trading Combine®? You'll be limited to
      Express Funded Account (XFA) Consistency — best day must stay under 40% of total profits per
      Payout period"; "Standard XFA is unavailable until RTP is completed". Under "If you’re placed
      into the RTP with an active Trading Combine:" - "Any Standard Trading Combine subscription
      started before RTP placement will remain as a Standard Trading Combine. If passed, it may be
      activated as either a Standard XFA or Consistency XFA." / "If Reset, the new Trading Combine
      will follow RTP rules — it will be a Consistency Trading Combine account with a Daily Loss
      Limit (DLL) and will follow this path if the account is passed." Under "If you're placed into
      the RTP with an active Standard XFA:" - "Your existing Standard XFA account is unaffected." /
      "Any new XFAs created during RTP will be Consistency XFA only" / "XFAs activated from Trading
      Combines purchased before your RTP placement can be Standard or Consistency with a Daily Loss
      Limit." On payouts: "Traders in RTP can request payouts of up to $6,000 every 3 trading days,
      provided consistency requirements are met." On Back2Funded: "The Reactivated Express Funded
      Account account will follow RTP rules and will be created on the Consistency Path with a Daily
      Loss Limit, regardless of if the original account was purchased before or after RTP
      placement." The SIX placement triggers, verbatim: "Multiple accounts hit the Maximum Loss Limit
      in one day"; "You max position a majority of your trades"; "You don’t keep losers smaller than
      winners"; "You don’t use stops"; "You go full port or trade on tilt, FOMO, or revenge"; "You
      disrespect your daily limits".
      RELATED PAGES READ 2026-10-01. 10490293 (Daily Loss Limit, dated June 30, 2026) says "$50K
      Account: $1,000" and, on hitting the limit, "Account stays eligible for funding. Resume
      tomorrow."; it does not mention RTP. 8284215 (XFA Parameters) says "At activation, you choose
      your Payout path: Standard or Consistency." and "Once you select XFA Consistency or Standard,
      that choice cannot be changed either."; it does not mention RTP. 8284197 (Combine Parameters,
      "Updated over a week ago") does not mention a "Consistency Trading Combine", a "Standard
      Trading Combine" or RTP. The term "Consistency Trading Combine" appears only on 13620045,
      where it means a Combine with the RTP DLL whose pass leads to the Consistency path.
      THE SCOPE, AS THE PAGE STATES IT (unchanged from 2026-09-27). (1) The -$1,000 DLL (50K) goes on
      every Combine bought during RTP, on a Combine RESET during RTP, on EVERY XFA activated during
      RTP (including one activated from a Combine bought before placement) and on a Back2Funded
      reactivation during RTP. (2) XFAs from Combines bought or reset during RTP are Consistency-only.
      A Combine bought BEFORE placement stays a Standard Combine and may be activated as a Standard
      OR a Consistency XFA, with a DLL (D-174). (3) A Standard XFA already active at placement "is
      unaffected". STILL NOT STATED: whether a Combine bought before placement carries a DLL while it
      is still a Combine, and what happens to a Consistency XFA already active at placement.
      TRIGGER 1 IS A CAMPAIGN-DESIGN FINDING (unchanged). Accounts that lose together can hit the MLL
      on the same day, which is the named trigger. The consequence is not closure but RTP placement,
      which costs in the currency the stage measures: a -$1,000 DLL on 50K, Consistency-path-only new
      XFAs, and no Standard XFA until RTP is completed, which for an XFA campaign means never (NEW 1,
      NEW 3). Trigger 2 gives the carried guardrail 'risk per position well below the maximum' an
      official citation. See DECISIONS.md D-27, D-218 and D-219.

  focused_trader_program:
    value: true
    units: boolean
    status: verified
    article_id: "10551016"
    url: https://help.topstep.com/en/articles/10551016-what-is-the-focused-trader-program
    date_read: 2026-10-30
    verified_by: rules-verifier (stage two), new row 2026-10-30 (D-490 (4), D-494); four fetches with differently worded prompts, identical wording
    note: >
      NEW ROW 2026-10-30. The program exists and its triggers and consequences are stated; NO trigger has a
      published number, threshold or time window ("excessive", "many", "short period", "multiple" are undefined on
      the page). Cited before this row by D-447 and D-477 (F4) from the 2026-10-25 read; the quotes below are
      today's. Page date "August 10, 2026". Opening: "The Focused Trader Program (FTP) resets your approach and
      helps you build the habits needed" / "to trade consistently and sustainably."
      CORRECTIVE PATH. "This path is for Traders who haven't followed Topstep's Terms of Use after multiple
      warnings." Reasons: "Hedging accounts against each other to gain funding"; "Excessive recycling of Trading
      Combines® or XFAs"; "Losing multiple LFAs"; "Behavior that goes against the Trader Pledge or real-world market
      discipline". What happens: "Immediately placed into the Focused Trader Program (outlined above)"; "All current
      accounts (Live, Express Funded Account, Trading Combine) are closed"; "No refunds are issued"; "Any pending
      payouts are denied"; "Any pending Express Funded Accounts or banked resets are removed (if applicable)".
      Account limit: "1 active $50K account at a time (Trading Combine, XFA, or LFA)". Time requirement: "6
      months". To request a Risk Team review: "6 months of consistent trading + $10K net LFA profits, or good
      trading behavior".
      SLOWDOWN PATH. "This path is for Traders who follow the Terms of Use but haven't found success in the LFA" /
      "or show patterns of unhealthy trading." Reasons: "Excessive Resets and Trading Combine purchases";
      "Activating and losing many Express Funded Accounts in a short period of time"; "Overtrading"; "Other
      unsustainable habits". What happens: "You may continue trading in your existing active accounts"; "You cannot
      purchase new Trading Combines, Resets, or B2F Reactivations"; "If all accounts close or expire, you move into
      the full FTP structure". Account limit: "Current active accounts can remain open but limited to 1 active $50K
      account at a time (Trading Combine, XFA, or LFA) once closed." Time requirement: "None". Review: "$10K net
      LFA profits or good trading behavior".
      BOTH. "For both paths, Risk Team review does not guarantee approval to rejoin the regular program or purchase
      multiple accounts." No notification or appeal process is described on the page. 13620045 (re-read the same
      day): "Under the Focused Trader Program, Traders are limited to one Express Funded Account at a time." /
      "However, a Trader may be moved from RTP to FTP if they continue to violate our Trader Pledge" / "or carry out
      the other prohibited trading strategies outlined here."
      WHAT IT MEANS HERE (D-490 (4), D-494). A campaign that buys dozens of Combines a month across five seats and
      ends most funded accounts by breach or closure at request matches the Slowdown Path's first two reasons in
      their words, and the Corrective Path's "Excessive recycling of Trading Combines® or XFAs" in its words, with
      no published line that separates it from them. The consequences are not a per-payout denial: the Slowdown
      Path stops new purchases and collapses the five seats to one as accounts close (the campaign's engine stops);
      the Corrective Path closes every account and denies every pending payout. Neither path is modelled. No code
      loads this key; it is recorded so the exposure is read beside the verdict (D-145 tier 3; the gate's 0 %
      denial, D-234, is the operator's rule and is not changed by this reading).

