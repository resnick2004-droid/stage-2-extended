      8284121, 8284099 read; "Minimum Trading Days" appears on the help centre only as a Topstep Labs parameter,
      15520357, value "None"; the "10 Active Trading Days" of 11748475 governs the Live Funded Account's risk
      expansion, not the Combine). The only floor is the one the consistency rule implies and the page states:
      8284197 "Can I pass the Trading Combine in one day? No. Big spike days don't build funded traders, consistency
      does. You can pass in as few as two days, but keep your best day below 55% of your Profit Target."; 8284208
      "You can pass in as few as 2 days"; 8284121 "No time limit for passing." Whether a minimum-days rule once
      existed and was removed is unverified (no page says so). The engine's consistency-cap exits (D-313) already
