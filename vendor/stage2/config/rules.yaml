      The Profit Target / Total Profit ambiguity recorded below is still on the page.
      EARLIER RECORD (2026-10-03), kept for history:
      RE-READ 2026-10-03, UNCHANGED at 0.55. 8284208 ("Updated over 2 weeks ago"): "Your single
      best day of profit must stay at or below 55% of your Profit Target. If it exceeds that, your
      Profit Target increases."; "Best Day Profit ÷ Total Profit = Best Day %"; "55% is a hard
      line. It is not rounded, and there is no buffer."; "$50K account: $1,600 best day ÷ $3,000
      total profit = 53% [check mark] — Consistency Target met."; "At 3:10 PM CT, that day's value
      locks into your trading history and cannot be changed." The ambiguity recorded below (the
      rule stated against the Profit Target, the formula against Total Profit) is still on the
      page; the engine's target_eff = max(3000, best_day/0.55) matches either reading.
      EARLIER RECORD (2026-09-22), kept for history:
      Re-read 2026-09-22, unchanged at 0.55. THE OFFICIAL VALUE IS 55%, NOT the 50% the
      third-party guides state: "Your single best day of profit must stay at or below 55% of
      your Profit Target." / "55% is a hard line."
      AMBIGUITY RECORDED RATHER THAN RESOLVED: the same page states the rule against the
      PROFIT TARGET but gives the formula against TOTAL PROFIT - "Best Day Profit / Total
      Profit = Best Day %". The tie-breaker is the consequence: "If it exceeds that, your
      Profit Target increases. You'll need to earn more to pass." Under EITHER reading the
      coded behaviour is the same - finish with total profit >= best_day/0.55 and >= $3,000 -
      so the engine's target_eff = max(3000, best_day/0.55) is correct either way. The
      ambiguity matters only if anyone later models a fixed $1,650 best-day cap with hard
      failure: the page is explicit that the account does NOT fail, the target rises.

