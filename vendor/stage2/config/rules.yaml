  payout_after_request_survives_mll_breach:
    value: true
    units: boolean
    status: verified
    article_id: "8284233"
    url: https://help.topstep.com/en/articles/8284233-topstep-payout-policy
    date_read: 2026-10-30
    verified_by: rules-verifier (stage two), new row; two fetches with differently worded prompts, identical wording; re-read 2026-10-30 by rules-verifier (D-490 (4), D-494)
    note: >
      RE-READ 2026-10-30, UNCHANGED. 8284233 ("Updated over 2 weeks ago"): "Yes. Once the Payout amount has been
      deducted from your balance, hitting the MLL won't affect it."; "Once you request a Payout, the funds are
      transferred immediately, allowing you to start trading again right away."; "Internal approval can take 1-3
      business days." The page still has no sentence on a payout pending at a closure at request, and none on
      denial or sole discretion; the review FAQ's list is unchanged. Still NOT COVERED: closure at request
      (xfa_closure_at_request) and the Focused Trader Program's Corrective Path ("Any pending payouts are denied",
      10551016, re-read 2026-10-30).
      EARLIER RECORD: NEW ROW, VERIFIED 2026-10-25 (D-445), for P-09's audit F1. 8284233 ("Updated over a week ago"), FAQ "Will I
      still get my Payout if I hit the MLL after requesting?": "Yes. Once the Payout amount has been deducted from
      your balance, hitting the MLL won't affect it." When the deduction happens, FAQ "How does trading impact my
      Payout request while it is being processed?": "Once you request a Payout, the funds are transferred
      immediately, allowing you to start trading again right away." Live accounts are the stated exception:
      "Live Accounts: Please note that after submitting a Payout request, trading should be paused until the
      Payout has been fully processed and the funds have been deducted from the account." On an XFA a breach
      closes the account: 8284204 (page date September 18, 2026) "Your account is permanently closed."; 8284215
      "Your account is liquidated and closed at the end of the day."
      SCOPE AND LIMITS. The MLL FAQ names no account type. That an XFA's payout is deducted at the request rests
      on the general sentence and the Live-only exception, not on a sentence naming the XFA. The payout still
      goes through the review every payout gets ("Internal approval can take 1-3 business days."; FAQ "What does
      Topstep review before approving a Payout?" - the Payout Policy requirements, Prohibited Conduct, the Terms
      of Use, Professional Behavior, Prohibited Trading Strategies), so the FAQ removes the breach as a reason to
      withhold the payout, not the review. NOT COVERED: an account closed at the trader's request with a payout
      pending (silent; see xfa_closure_at_request), and accounts closed by the firm on the Focused Trader
      Program's Corrective Path, where 10551016 says "Any pending payouts are denied".
      PROCESSING TIME, read the same day on 8284233, unchanged against payout_lag_days_aeropay and
      payout_lag_days_ach (not re-dated): "Internal approval can take 1-3 business days."; Aeropay "Instant after
      approval"; Wise and ACH "1-3 business days"; Wire/SWIFT "5-10 business days"; Prop-to-Brokerage "Same day*"
      ("If requested by 12 pm CT"); "Processing times are estimates and exclude weekends and holidays."; "Not all
      Aeropay Payouts deliver instantly — processing times may vary depending on review and approval steps."
      ENGINE. lockstep credits a payout pending at an MLL breach when it arrives (P-09's audit F1); this reading
      supports that for breaches only. No code loads this key.

