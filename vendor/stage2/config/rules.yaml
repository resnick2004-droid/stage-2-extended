  billing_days:
    value: 21
    units: trading days (the engine's day index)
    status: verified
    article_id: "8284121"
    url: https://help.topstep.com/en/articles/8284121-trading-combine-subscriptions
    date_read: 2026-11-14
    verified_by: rules-verifier (stage two); unit error corrected by the session; re-read 2026-11-14 by rules-verifier
    note: >
      RE-READ 2026-11-14, UNCHANGED: the official sentence behind this derived value is the same.
      8284121 (NOW SHOWS "Updated this week"; it showed "Updated over 2 weeks ago" on 2026-10-30,
      so the page was edited in the week before this read; two fetches with differently worded
      prompts): "It Rebills every 30 days from your original sign-up date." 21 trading days stays
      the engine's translation of 30 calendar days (30 x 252/365 = ~20.7).
      EARLIER RECORD (2026-09-22), kept for history:
      CORRECTED 2026-09-22 back to 21, and propsim D-31 STANDS. The official rule is 30
      CALENDAR days - "It Rebills every 30 days from your original sign-up date" (8284121,
      spot-checked) - but this key is consumed by propsim.simulate_combine as
      `d % billing_days`, where d indexes TRADING days. 30 calendar days x 252/365 = ~20.7
      trading days, so 21 trading days IS the correct translation and stage one's convention
      was right.
      An earlier stage-two entry (D-25) set this to 30 and claimed the repo had been
      over-charging subscriptions by ~43%. That was a UNIT ERROR: it compared 21 trading days
      with 30 calendar days as if they were the same unit. Billing every 30 TRADING days is
      ~43.5 calendar days and would have UNDER-charged by ~40%. Corrected by D-29; the
      official calendar figure is carried separately as billing_period_calendar_days so the
      fact and the engine convention cannot be confused again.

