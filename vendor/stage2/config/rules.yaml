      third-party tools." The same page answers the same-direction question (FAQ "Can I trade the
      same instrument across multiple accounts?"); that is recorded under
      multi_account_same_strategy.

      EARLIER RECORD (2026-09-23), kept for history: Page "Understanding Hedging", read 2026-09-23. Verbatim: "Cross-account
      hedging is prohibited at Topstep", defined as "simultaneously going long and
      short the same or correlated instrument across multiple accounts". The sentence
      that sets the engineering requirement: "Opposing positions are prohibited even
      if the overlap is brief or unintentional." BRIEF AND UNINTENTIONAL ARE BOTH
      NAMED, so this cannot be treated as a conduct guideline to be honoured on average
      - it is a hard invariant that must hold at every instant, including during order
      transit. Consequences escalate: first violation gives a warning window to un-hedge,
      then automatic liquidation of the hedged positions and an account flag; repeat
      or excessive violations bring immediate liquidation and a Temporary Hedging
      Violation barring trading for the rest of the day; "after numerous warnings,
      your account may be permanently closed without further notice". And the part
      that makes it a campaign-level risk rather than a per-trade one: "Accounts closed
      for hedging violations are not eligible for payouts, and any associated profits
      cannot be withdrawn", and such accounts "cannot be reopened or reinstated". Note
      "or correlated instrument" - the prohibition is NOT limited to the identical
      contract, so ES against MES, or ES against NQ, is in scope. See DECISIONS.md
      D-55 for the rule that guarantees compliance by construction.
      '

