      and it does not. 8284215 FAQ "Can I trade across multiple XFAs at once?" — "Yes, up to $750K
      buying power using a trade copier. See [What is a Trade Copier]. Hedging across accounts and
      coordinated trading with others is prohibited." 13747047 (Understanding Hedging, an article NOT in
      stage one's id list): "Yes! You can trade the same markets across different accounts. What's
      prohibited is holding opposite positions simultaneously in a way that eliminates market risk."
      Topstep ships a first-party Trade Copier (14434175): "The Trade Copier lets you mirror trades from
      a Lead account to 1 or more Follower accounts automatically — so you can run the same strategy
      across multiple accounts without placing every order manually."
      RESTRICTIONS, all quoted: (1) all accounts under one profile — 8284197 "All Trading Combines,
      Express Funded Accounts, and Live Funded Accounts must be under 1 Topstep profile"; (2) no
      opposite positions across your own accounts — 10296582 "Cross-account hedging (single-user) —
      holding opposite positions across multiple accounts simultaneously"; (3) no coordination with
      other people — 10296582 "Coordinated trading — performing trades in concert with others ... to
      pool risk, hedge aggregate positions, or trade the same or opposite strategy simultaneously";
      (4) copier unavailable on Live Funded Accounts (14434175); (5) "The Lead account must have the
      lowest Maximum Position Size (MPS) of all accounts in the group" (14434175) — inert for a
      homogeneous 5x50K campaign, but it means a mixed-size group trades the SMALLEST account's size;
      (6) a "$750K buying power" ceiling applies when copying across XFAs and the term is NOT DEFINED on
      any official page read.
      ACCOUNT STACKING DOES NOT REACH THIS. 10305426: "Account Stacking — Repeatedly trading
      aggressively, hitting the Maximum Loss Limit (MLL) in one account, then switching to another
      account and repeating. The goal is to run high-risk attempts until a large win occurs." That is
      the fail-and-repurchase pattern stage one ruled out (propsim D-34), not one genuine-edge strategy
      run concurrently. 10305426 is silent on copy trading and multi-account replication.
      See DECISIONS.md D-22.

