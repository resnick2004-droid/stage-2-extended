      27, 2026" (before the 2026-09-23 read). Verbatim: "Cross-account hedging is prohibited at
      Topstep."; "Cross-account hedging means simultaneously going long and short the same or
      correlated instrument across multiple accounts"; "Opposing positions are prohibited even if
      the overlap is brief or unintentional."; "Accounts closed for hedging violations are not
      eligible for payouts, and any associated profits cannot be withdrawn."; "Confirmed hedging
      violations are final and not eligible for appeal". NEW TO THE RECORD: FAQ "Are hedging
      attempts tracked at the account level or trader level?" - "Hedging attempts are tracked at
      the Trader level."; and "Technical glitches and copy trading software can create temporary
      opposite positions — our system accounts for that. But you''re still fully responsible for
