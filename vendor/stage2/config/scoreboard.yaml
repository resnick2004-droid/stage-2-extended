# The scoreboard (R2; docs/HANDOFF_RESET_2026-10-29.md §7 item 6): every registered run's gate rows side by side, read
# from the run's own result file by `propedge/reporting/scoreboard.py`; `scripts/scoreboard.py` writes
# `results/scoreboard.csv` with its manifest. No number is typed here: a run names its file and how its rows are read.
#
# Adding a run: append an entry under `runs` with its result file and engine, rebuild (`python scripts/scoreboard.py`),
# rebuild the report (`python scripts/build_report.py`), commit. `tests/test_scoreboard.py` refuses a scoreboard whose
# sources changed since it was built.
#
# engine:
#   coin_screen -- the resolved coin's screen (D-521, D-527): `cell` names the carried cell of its file's section
#                 "cell"; its growth on the required bankroll is the portfolio engine's measure; a screen, never a verdict.
#   portfolio  -- the D-312 portfolio engine: the gate row is section "gate" at the lower bound, 0 % denial, placement
#                 off; its metric is `pf_growth_on_base_p50` on `pf_required_p90` (growth on the required bankroll).
#   notional   -- the older engine (before D-312): only `median_log_growth` on a notional bankroll exists; it is reported
#                 in its own columns and never compared with the portfolio engine's growth.
#
# kind: development | confirmation. "Beat FV3-C's row or stop" (D-365, D-382, D-452) compares a run with FV3-C's row of
# the same kind -- a development run with FV3-C's development baseline, a confirmation with P-06 -- because a one-year
# confirmation reads a wider bound than five development years (D-451); both comparisons are in the file.
#
# flags: FLAG columns (docs/SUCCESS_CRITERIA.md §5; D-457, D-475) read each portfolio run's gate row against
#   results/success_thresholds.csv, levels from P-06's campaign (504 sessions, 500 paths, Topstep's seats). A run of
#   another kind of campaign -- horizon, path count or firm -- declares `flags: false` and reads "not applicable".

row_to_beat:
  development: FV3-C-dev
  confirmation: P-06

# The coin baseline (D-521 (7), D-527): every growth row's lift over it (`growth_bound_minus_coin`), and beside it each
# run's lift over its own zero-edge twin (`signal_lift_over_zero_edge_twin`).
coin_baseline: RC-coin

runs:
