# The account-state risk policy of the two-stream candidate FV3-G/F, version 16 (D-346): config/state_policy_v15.yaml with
# the flip action's CONTRACT changed by the operator's rule -- five MNQ micros instead of one NQ mini at the same 20-point
# width, $200 at risk instead of $400 (config/flip_sizing.yaml: the fewest micros whose risk sits on this table's $50 grid
# and whose win after fees clears the $150 net winning-day bar). The flip map is re-scored under that rule
# (results/flip_map_nq_seconds_micros.csv; the one-mini reading, results/flip_map_nq_seconds.csv, stays on record): the
# same slot and width (08:30 CT, 20 points: the width rule is unchanged, resolution belongs to the width), the shares
# unchanged, the cost per attempt re-priced at five micros' fees. Everything else is v15's: a scratched bracket is a day
# without a trade, the resolving attempts carry the edge that keeps the attempt's value the row's, the flip is COPIED
# across the flip-state accounts in the engine, D-341's tie rule stays. Export version 16. A NEW solve (the v15 solve was
# stopped at the operator's word before it wrote, D-346). EXPLORATORY and engine-only. The result:
# results/state_policy_v16.csv and its policies file.
decision: D-346
script: scripts/state_policy_dp.py
module: propedge/campaign/state_policy.py

outcomes:
  model: "stage one's binary process: p = (1 + e) / (1 + R), the same e at every R (propsim D-06); a trade risking more than the room above the floor is raced against the floor by the engine's p_race / theta_from_edge (floor_mode truncate, edge_mode drift) -- under the room cap a Combine trade never does; a realised win is rounded to the $50 grid and its probability read at the R the grid makes of it, so every action is exactly fair at zero edge; D-318: an action's R offered at each rung on its availability share of days, no trade otherwise (fair: no trade moves nothing); D-339 / D-345 / D-346: the flip action's p from its own measured net edge at every cell, offered on 1 - its scratch share of days, a scratched day a day without a trade"
  edges: [-0.05, -0.025, 0.0, 0.025, 0.05, 0.10]     # D-290's grid, unchanged

rules: "rules_for_method('aeropay') from config/rules.yaml -- the verified ledger; D-289: the Standard path, no placement"
horizon_days: 504
slot_rent_per_day: fixed_point                       # D-329: lambda* per edge (see the header); D-291's $25 was a cell tried, never derived
rent_fixed_point:
  start: 25.0                                        # the first round's rent (D-291's); each later edge starts from the previous edge's lambda*
  tolerance: 0.25                                    # dollars per slot-day: converged when the rate the policy earns is within it of the rent it was solved at
  max_rounds: 10

menu:                                                # the funded leg's menu (v5's, unchanged)
  step: 50.0
  risks: [250, 500, 750, 1000, 1500, 2000]
  rrs: [1.0, 1.5, 2.0, 2.5, 3.0]
  skip: true

funded_flip:                                         # D-346: the fast bracket's action (funded menu only) in five micros, every statistic READ from the re-scored flip map's chosen row
  risk: 200.0                                        # five MNQ at the chosen width (5 x 20 points x $2): $200 at risk, $200 to win -- the scorer refuses if the row disagrees
  rr: 1.0
  source_file: results/flip_map_nq_seconds_micros.csv   # the second-resolution flip map (D-344; kit R138, NQ 2020-01 to 2025-06 at actual prices, one-second bars) re-scored under config/flip_sizing.yaml (D-346)
  row: {section: choice, role: rule}                 # the slot and width the map's declared rules chose (the widest width resolving inside the box nine times in ten in every year, the cheaper slot), at the contract rule's count
  edge_field: e_net                                  # the row's net edge per attempt: target share less stop share plus the scratches' mean P&L over the risk, less the cost (five micros' fees, the spread, a tick on a stop)
  lower_bound_field: e_net_lower_bound               # its one-sided 95 % bound over the yearly blocks (the engine's lower-bound arm reads it)
  scratch_field: scratch_share                       # D-343: the share closed at the box unresolved -- a day without a trade in the table
  risk_per_contract: {field: chosen_width_points, point_value: 2.0}   # what one MICRO risks at the chosen width ($40 at 20 points); five of them make the action's $200
  copy: true                                         # D-343 (2): one shared outcome a day across the flip-state accounts (the engine; the campaign check's model)
  availability: 1.0                                  # a scheduled bracket is always offered (the scratch share is taken off it in the table)

combine_menu:                                        # D-316's, unchanged
  risks: [250, 500, 750, 1000, 1500, 2000, 2500, 3000]
  rrs: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 2.5, 3.0]
  min_rr: 0.25

rungs:                                               # D-306's, with D-318's availability
  file: results/fv3_rung_shares_2020.csv
  availability_file: results/fv3_rung_availability_2021.csv   # D-318: from results/fv3_studio_portfolio_v3_point_trades.csv (D-310's declared cell under the fidelity protocol's fixed stops, every quarter R carried), 2021 on
  phase: all
  stops_ticks: {half: 50, full: 100, double: 200}
  tick_value: 0.5
  combine_cap_micros: 50
  funded_caps: {0: 20, 1500: 30, 2000: 50}
  exit_grid: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]

combine_rules:                                       # D-313's two rules, unchanged; D-329's tie-break and abandon
  room_cap: true
  consistency_cap: true
  tie_break_tol: 5.0                                 # among the trades within $5 of the state's best value, the higher R
  tie_prefer: high_rr
  abandon: true                                      # the attempt cancelled at the close that decides it (8284121; D-334), worth 0, the slot freed; taken exactly where nothing beats it

funded_rules:                                        # D-325's two rules, unchanged; D-329's abandon; D-341's preference at equal risk
  tie_break_tol: 5.0                                 # among the trades within $5 of the state's best value, the smallest dollar risk (no trade the smallest)
  tie_prefer: small_risk_flip_first                  # D-341: at equal risk within the tolerance the flip before the strategy's trade (at $200 no strategy trade shares the risk; the menu's smallest is $250)
  profit_risk_cap: 500.0                             # once the balance is above its start (every paid state), no action risks more than $500 -- the $200 flip is within it
  abandon: true                                      # the XFA closed at the trader's request (10657969 -- its terms unstated, D-336 (ii)), nothing credited, worth 0, the slot freed; taken exactly where nothing beats it

funded:
  balance_cap: 6000.0
  payout_grid_step: 50.0

objective: "expected cash from one attempt within the horizon: the Combine's subscription accrued per trading day (subscription / billing_days), the activation at a pass, net payouts (profit split, the method's fee), less the slot rent per account-day -- the rent lambda* per edge (D-329); an abandoned account pays no rent from the day it is dropped; no credit for survival"

baselines:                                           # the fixed legs under the same allowance, the Combine's two rules and the availability, at lambda*; neither the funded rules, abandon nor the flip applies to a fixed leg
  - {name: s1_1to1_1500, combine_rr: 1.0, combine_risk: 1500, funded_rr: 1.5, funded_risk: 1000}
  - {name: s1_1p5to1_1000, combine_rr: 1.5, combine_risk: 1000, funded_rr: 1.5, funded_risk: 1000}
  - {name: fv3_fresh, combine_rr: 0.75, combine_risk: 2000, funded_rr: 3.0, funded_risk: 2000}   # D-317's v5 fresh geometry

oracles:                                             # CLAUDE.md: a value outside a ceiling is an engine error (abandon only lowers a pass probability and pays nothing; the oracle's funded table is solved without the flip, whose edge is its own)
  zero_edge_no_fees_max_p_pass: 0.327131
  zero_edge_no_fees_p_pass_1to1_1500: 0.32653061224   # 16/49 (the fixed geometry without rungs or rules: the contract's own oracle)
  zero_edge_no_fees_max_gross_payouts: 2000.0

export:
  balance_band: 250.0
  cushion_band: 250.0

campaign_check:                                      # D-290 (8): the engine's own binary campaign (its draw takes no need, so neither exit, the room cap nor the availability applies there -- D-317: not a test of this table); D-340: a flip leaf runs through the table's binary model of the flip, D-345: with its scratch and copied; D-346: five micros
  accounts: 5
  combines: 5
  bankroll: 5000
  horizon_days: 504
  n_paths: 500
  payout_method: aeropay
  seed: 20261016
  fixed_legs: {combine_rr: 1.5, combine_risk: 1000, funded_rr: 1.5, funded_risk: 1000}
