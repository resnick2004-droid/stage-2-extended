  prohibited_conduct:
    value: "microscalping; hedging (same-account, cross-account, cross-user, cross-firm, correlated opposing); HFT; exploiting platform/sim mechanics"
    status: verified
    article_id: "11404732-trade-with-integrity"
    url: "https://support.lucidtrading.com/en/articles/11404732-trade-with-integrity"
    date_read: "2026-10-30"
    verified_by: "rules-verifier agent, session 2026-10-30 (D-30)"
    note: |
      Trade with Integrity (11404732) prohibits "Taking advantage of system errors or
      update delays", "Exploiting discrepancies in simulated prices", "Using tactics
      that do not reflect real-world trading conditions"; "These behaviors violate
      the spirit of the program and undermine the integrity of the trading ecosystem
      we are building."; "We're here to fund real traders not opportunists."
      Microscalping (11404742): flagged if "More than 50% of your profits are
      generated from trades held for 5 seconds or less" — manual review, written
      warning, then "All profits from microscalping activity will be forfeited" and
      possible permanent restriction; appeals allowed. Hedging (11404734): "You will
      receive an email notice & the associated accounts will be reset to prior days
      balance. Despite the balance reset, this does not reset the total remaining
      drawdown on these accounts."; "After repeated offenses all involved accounts
      will be breached and you may be permanently restricted from using Lucid Trading
      services."; "Accounts with a Hedging Violation are not eligible for intraday
      payouts." (16226050). HFT (11404736): first offense written warning; repeated
      offenses profit removal, account closure, permanent restriction; appeals
      allowed. Martingaling is "strongly discouraged" but not prohibited (11404728).
      Genuine scalping, DCA, scaling in, flipping ("Flipping is allowed") and
      automation are permitted (11404728). Re-verified 2026-10-30, value unchanged
      (D-07); the drawdown-not-reset and no-intraday-payout consequences are new text.

