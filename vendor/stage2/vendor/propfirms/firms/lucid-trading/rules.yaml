      consistency add-on"). Evaluation only: "The consistency requirement (40%, or
      50% with the add-on) applies only during the evaluation stage." This row carries
      the standard 40 %; the 50 % add-on (and its price) is not modelled.
      HISTORY: was 0.50, read 2026-10-04 (D-07) — then the only option, quoted as
      "The LucidFlex evaluation 50% consistency has cushion built in, so you can pass
      in two days" (12945790).

