# Machine-readable copy of RULES_LEDGER.md — keys match the ledger 1:1.
#
# propfirms/spec.py loads this file and RAISES for any rule whose status is not
# `verified`. Written together with the ledger by the rules-verifier agent
# (/verify-rule); never hand-edit one without the other.
#
# Each rule:
#   value:      canonical value the code loads (number, string enum, bool) — null until read
#   status:     verified | carried_reverify | unverified_human_input_required | third_party
#   article_id: the official page/article id (or page slug if the site has no ids)
#   url:        the official URL read
#   date_read:  YYYY-MM-DD
#   verified_by: who/what read it
#   note:       the EXACT quoted text from the official page
#
# History: first captured 2026-10-04 (D-07; operator reads D-22, D-28). Every row
# re-read 2026-10-30 (D-30); a changed row keeps its earlier value in its note.

firm: "Lucid Trading"
program: "LucidFlex, $50,000 account (futures evaluation -> sim-funded -> at most 5 payouts per account, then Lucid's live review pool; the live move is at the risk team's discretion, article 16558826). Chosen per D-06 as the mainstream plan at the tier closest to $50K: LucidFlex is the first plan listed on the firm's own help centre and has the fullest rule set. Since the October 2026 customization (article 16226050) the checkout has two settings — Daily Loss Limit on/off and evaluation consistency 40 % (standard) or 50 % (paid add-on), four configurations; the rows carry the standard 40 % and the modelled variant is DLL OFF (docs/T4_ENGINE_FIT.md §1; D-30). Other plans at the same tier exist (LucidDaily, LucidPro, LucidDirect, LucidBlack legacy, LucidMaxx, LucidLive) — see ledger §E."
official_domains: ["lucidtrading.com", "support.lucidtrading.com", "intercom.help/lucid-trading"]
# lucidtrading.com refuses non-browser clients (HTTP 403 on 2026-10-04; not readable by an
# agent on 2026-10-30 either), so the readings are from the firm's official help centre.
# On 2026-10-04 it was read at intercom.help/lucid-trading; on 2026-10-30 its canonical host
# is support.lucidtrading.com (same article ids; masthead "Lucid Home" links to
# lucidtrading.com), and every 2026-10-30 reading below is from that host.

