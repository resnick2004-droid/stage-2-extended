      $50K row of the Payout Maximum table: "50% of Profit up to $2,000". The bullet
      above the table words it differently — "Maximum payout request: Futures traders
      may request 50% of their account balance up to a maximum dollar amount." — the
      per-size table cell is the controlling statement and the engine's recorded
      reading ("profits" = balance above start) stands. "Unlike our other prop firm
      funded accounts, the maximums here do not scale up with more payouts."
      Lifetime: "Traders may take up to 5 payouts from each LucidFlex account after
      which they will be moved live." and "Payout 5 represents the maximum payout
      level" (16558826) — so at most 5 x $2,000 = $10,000 can ever be withdrawn from
      one $50K sim-funded account. Re-verified 2026-10-30, value unchanged (D-07).

  payout_frequency_gate:
    value: "any day, per cycle: net profit >= $1 and 5 days with daily profit >= $150; max 5 payouts per account, then the live review pool (live move at the risk team's discretion)"
    status: verified
    article_id: "12945796-lucidflex-payouts"
    url: "https://support.lucidtrading.com/en/articles/12945796-lucidflex-payouts"
    date_read: "2026-10-30"
    verified_by: "rules-verifier agent, session 2026-10-30 (D-30)"
    note: |
      "There is no fixed payout window, you may request a payout any day after meeting
      all eligibility criteria." Per cycle: "Traders must earn at least the minimum
      required profit on 5 separate days during the payout cycle. The minimum profit
      on trading days reset and must be earned again after every approved payout." —
      the $50K minimum daily profit is "$150" — and "Traders must have positive net
      profit (even just $1) during each payout cycle in order to request a payout."
      Lifetime: "Traders may take up to 5 payouts from each LucidFlex account after
      which they will be moved live." (12945796, page updated 2026-07-28); the New
      Live Structure (16558826, page updated 2026-10-14) makes the move a review:
      "Traders enter the live review pool when one or more of the following
      conditions are met: After receiving the final payout (Payout 5) on their Flex,
      Pro, or Direct plan"; "All live transitions occur at the discretion of the
      Lucid risk team." Timing: with the DLL OFF (the modelled variant) "Payouts
      follow the regular end-of-day schedule"; with the DLL ON the funded account
      "can request payouts during the trading session, from profit made that session
      (6:00 PM to 3:45 PM ET)" and "After requesting an intraday payout, trading on
      your funded LucidFlex account is paused until the end of the trading day."
      (16226050). CHANGED 2026-10-30 (D-30) in the post-cap wording only: was "...;
      max 5 payouts per account, then moved live" (D-07). The per-cycle gate and the
      5-payout maximum are unchanged.
      CROSS-CHECK 2026-11-05 (D-31): the 50K Flex Funded rules card reads "Min Days
      of Profit 5 of $150", "Days to Payout 5", "Payouts to Live: 5" and "Account
      Activation Fee: FREE" (evidence/2026-11-05/50k_funded_rules.png) — consistent
      with this row; "Days to Payout 5" is read as the same five profitable days, not
      a separate calendar wait. With the DLL ON, the card's "On Demand Payouts" switch
      is ON (intraday payouts, 16226050); the modelled DLL-OFF variant has it OFF.

